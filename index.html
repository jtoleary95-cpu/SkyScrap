<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2338">
<title>Sky Scrap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2338;--panel:#24304d;--panel2:#2f3d61;--hi:#ffd166;--txt:#f4f1ea;--dim:#9aa6c4;--p1:#ff5a5f;--p2:#4ea8ff;--p3:#ffc93c;--p4:#4cd47a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--txt);font-family:'Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#menu.on{pointer-events:auto}
.scr{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 14px;height:100%;overflow:auto;width:100%}
.scr>.in{margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.bar{display:flex;align-items:center;justify-content:space-between;width:min(860px,100%);gap:10px}
.vs{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;width:min(860px,100%);align-items:start}
.vs .card{width:100%}
@media (max-width:640px){.vs{grid-template-columns:1fr}}
.dim{background:rgba(15,20,35,.72)}
.logo{font-size:min(15vw,96px);line-height:.9;font-weight:800;letter-spacing:2px;color:#fff;text-shadow:0 5px 0 #c2403d,0 9px 0 #1b2338,0 0 30px rgba(255,209,102,.5);transform:rotate(-3deg);margin:4px 0 10px;text-align:center}
.logo small{display:block;font-size:.32em;color:var(--hi);text-shadow:0 3px 0 #1b2338;letter-spacing:6px}
.btn{pointer-events:auto;font:inherit;font-weight:800;font-size:22px;color:var(--ink);background:var(--hi);border:0;border-radius:16px;padding:8px 28px;min-width:220px;box-shadow:0 5px 0 #b8892a;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8892a}
.btn.alt{background:#e8ecf7;box-shadow:0 5px 0 #8f9bb9}
.btn.off{background:#4b5675;color:#8d97b3;box-shadow:0 5px 0 #323a52}
.btn.sm{font-size:17px;min-width:0;padding:5px 16px;border-radius:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{background:var(--panel);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 #141a2b;width:min(680px,100%)}
.card h3{margin:0 0 6px;font-size:16px;color:var(--dim);letter-spacing:2px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slot{background:var(--panel2);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent}
.slot.off{opacity:.45}
.slot .tag{font-weight:800;font-size:15px;border-radius:8px;padding:0 10px;color:#fff;width:100%;text-align:center;cursor:pointer}
.slot canvas{position:static;width:min(58px,11vh);height:min(58px,11vh);cursor:pointer}
.slot .nm{font-weight:800;font-size:16px;cursor:pointer;line-height:1.1}
.slot .lv{display:flex;gap:4px;align-items:center;font-size:14px;white-space:nowrap}
.slot .lv b{background:#46557f;border-radius:8px;width:26px;text-align:center;cursor:pointer}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;font-size:16px;font-weight:600;flex-wrap:wrap}
.seg{display:flex;gap:4px}
.seg b{background:#46557f;border-radius:10px;padding:2px 12px;cursor:pointer;font-weight:800}
.seg b.on{background:var(--hi);color:var(--ink)}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.stg .secret{background:#120d22;color:#b388ff}
.stg div{background:var(--panel2);border-radius:12px;padding:2px 8px;font-weight:800;font-size:15px;line-height:1.15;border:3px solid transparent;cursor:pointer}
.stg div.on{border-color:var(--hi)}
.stg div.lock{opacity:.4;cursor:default}
.stg small{display:block;font-weight:600;color:var(--dim);font-size:11px}
.res{width:min(680px,100%);display:flex;flex-direction:column;gap:6px}
.res .r{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:6px 12px;font-size:17px}
.res .pl{font-size:26px;font-weight:800;width:44px}
.res .nmx{flex:1;font-weight:800}
.res .st{color:var(--dim);font-size:14px}
h2{margin:0;font-size:36px;color:var(--hi);text-shadow:0 3px 0 #1b2338}
#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--ink);font-size:24px;font-weight:800;text-align:center;padding:20px;z-index:9}
@media (orientation:portrait) and (max-width:900px){#rot{display:flex}}
.ph{font-size:60px;animation:tilt 1.6s ease-in-out infinite}
@keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
.note{color:var(--dim);font-size:14px;text-align:center;max-width:560px}
.cdot{width:22px;height:22px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 2px 0 #141a2b;flex:none}
.srow{display:flex;gap:4px 6px;align-items:center;justify-content:center;min-height:24px;flex-wrap:wrap}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(780px,100%)}
.ctile{background:var(--panel2);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid transparent;cursor:pointer}
.ctile.on{border-color:var(--hi)}
.ctile canvas{position:static;width:min(64px,12vh);height:min(64px,12vh)}
.ctile b{font-size:17px}.ctile small{color:var(--dim);font-size:11px;text-align:center;line-height:1.15}
.seg{flex-wrap:wrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menu"></div>
<div id="rot"><div class="ph">📱</div>Turn your phone sideways<div class="note">Sky Scrap plays in landscape.</div></div>
<script>
'use strict';
/* =========================================================
   SKY SCRAP  —  an original platform fighter
   ========================================================= */
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
let SW=0,SH=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);SW=innerWidth;SH=innerHeight;cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);cv.style.width=SW+'px';cv.style.height=SH+'px';}
addEventListener('resize',resize);resize();

const PCOL=['#ff5a5f','#4ea8ff','#ffc93c','#4cd47a'];
const PALETTE=['#ff5a5f','#4ea8ff','#ffc93c','#4cd47a','#a77bff','#ff9f43','#ff7ac8','#f2f2f2'];
function mixc(a,b,t){const p=parseInt(a.slice(1),16),q=parseInt(b.slice(1),16);const ch=(sh)=>Math.round(((p>>sh)&255)*(1-t)+((q>>sh)&255)*t);return '#'+((1<<24)|(ch(16)<<16)|(ch(8)<<8)|ch(0)).toString(16).slice(1);}
// give every active slot a distinct color, keeping choices where possible
function fixColors(slots){const used=new Set();slots.forEach((q,k)=>{if(!q||q.type==='off')return;let c=(q.col===undefined||q.col===null)?k:q.col;
 for(let n=0;n<8&&used.has(c);n++)c=(c+1)%8;q.col=c;used.add(c);});return slots;}
function nextFreeCol(slots,k){const used=new Set(slots.map((q,j)=>j!==k&&q&&q.type!=='off'?q.col:null));let c=slots[k].col;for(let n=0;n<8;n++){c=(c+1)%8;if(!used.has(c))return c;}return slots[k].col;}
const rand=Math.random,sgn=v=>v>0?1:v<0?-1:0,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;

/* ---------------- settings & setup ---------------- */
const SAVEKEY='skyscrap_v1';
const setup={rules:'stock',stocks:4,minutes:4,stage:'temple',tapJump:true,sound:true,music:true,
  slots:[{type:'human',char:'mochi',lvl:5},{type:'cpu',char:'gorbo',lvl:5},{type:'off',char:'mochi',lvl:5},{type:'off',char:'gorbo',lvl:5}]};
try{const s=JSON.parse(localStorage.getItem(SAVEKEY)||'null');if(s)Object.assign(setup,s);}catch(e){}
function saveSetup(){try{localStorage.setItem(SAVEKEY,JSON.stringify(setup));}catch(e){}}

/* ---------------- stage ---------------- */
// moving platforms (Storm Front)
var MOV={list:[],waveT:0,dir:'east',spawnT:0,n:0,flash:0};
function mkMover(cx,cy,w,vx,vy){return{x1:cx-w/2,x2:cx+w/2,y:cy,vx,vy,soft:true,moving:true,id:++MOV.n,seed:rand()*10};}
function mkFloe(cx,cy,w,vx){const m=mkMover(cx,cy,w,vx,0);m.ice=1;m.occ=0;m.baseY=cy;m.ph=rand()*6;return m;}
function resetMovers(){MOV.list=[];MOV.waveT=0;MOV.dir='east';MOV.spawnT=60;MOV.flash=0;MOV.respawnQ=[];
 if(!STG||!STG.movers)return;
 if(STG.movers==='ice'){for(const [x,y,w,vx] of [[-240,0,160,0.3],[-80,6,140,-0.25],[80,0,140,0.25],[240,4,160,-0.3],[-160,-120,130,0.35],[160,-130,130,-0.35],[0,-230,130,0.3]])MOV.list.push(mkFloe(x,y,w,vx));return;}
 for(const [x,y,w] of [[-300,-40,150],[260,-120,140],[-560,-200,150],[60,-250,130],[520,-30,140]])MOV.list.push(mkMover(x,y,w,1.1,0));}
function spawnMover(){const d=MOV.dir,w=125+rand()*55;
 if(d==='east')MOV.list.push(mkMover(-940,-290+rand()*330,w,1.0+rand()*0.6,0));
 else if(d==='west')MOV.list.push(mkMover(940,-290+rand()*330,w,-(1.0+rand()*0.6),0));
 else if(d==='rise'){let x=(rand()<0.5?-1:1)*(150+rand()*420);MOV.list.push(mkMover(x,470,w,0,-(0.9+rand()*0.5)));}
 else{let x=(rand()<0.5?-1:1)*(150+rand()*420);MOV.list.push(mkMover(x,-720,w,0,0.8+rand()*0.4));}}
function stepMovers(){
 if(!STG.movers)return;
 if(STG.movers==='ice')return stepIce();
 MOV.waveT++;if(MOV.waveT>=360){MOV.waveT=0;const opts=['east','west','rise','sink'].filter(d=>d!==MOV.dir);MOV.dir=opts[Math.floor(rand()*opts.length)];MOV.spawnT=20;}
 if(--MOV.spawnT<=0){MOV.spawnT=85+rand()*45;spawnMover();}
 for(const m of MOV.list){m.x1+=m.vx;m.x2+=m.vx;m.y+=m.vy;if(m.x1>1050||m.x2<-1050||m.y<-800||m.y>500)m.dead=true;}
 MOV.list=MOV.list.filter(m=>!m.dead);
 if(MOV.flash>0)MOV.flash--;else if(rand()<0.003){MOV.flash=18;snd('thunder',.5);}
}
function stepIce(){
 for(const m of MOV.list){const cx=(m.x1+m.x2)/2;if((cx>560&&m.vx>0)||(cx<-560&&m.vx<0))m.vx=-m.vx;
  if(m.rise!==undefined){m.baseY=Math.max(m.rise,m.baseY-4);if(m.baseY<=m.rise)delete m.rise;}
  const oy=m.y;m.ph+=0.03;m.y=m.baseY+Math.sin(m.ph)*4;m.vy=m.y-oy;m.x1+=m.vx;m.x2+=m.vx;
  const rid=fighters.some(f=>!f.out&&f.ground===m);
  if(rid){m.occ++;if(m.occ===360){snd('crack',.5);}if(m.occ>=480){m.dead=true;snd('shatter',.8);
   for(let k=0;k<14;k++)fxPush({k:'ice',x:m.x1+rand()*(m.x2-m.x1),y:m.y+rand()*10,vx:(rand()-.5)*4,vy:-1-rand()*3,t:0,len:30,s:4+rand()*6});
   MOV.respawnQ.push(80);}}
  else m.occ=Math.max(0,m.occ-0.5);}
 MOV.list=MOV.list.filter(m=>!m.dead);
 MOV.respawnQ=MOV.respawnQ.map(t=>t-1);
 while(MOV.respawnQ.length&&MOV.respawnQ[0]<=0){MOV.respawnQ.shift();
  // a fresh sheet bobs up out of the water in an open spot
  let x=0;for(let tries=0;tries<12;tries++){x=(rand()-.5)*760;if(!MOV.list.some(m=>Math.abs((m.x1+m.x2)/2-x)<150))break;}
  const by=-200+rand()*210,m=mkFloe(x,STG.water+20,130+rand()*40,(rand()<0.5?-1:1)*(0.2+rand()*0.25));m.rise=by;MOV.list.push(m);splash(x,STG.water,10);snd('splash',.5);}
}
// ---- stage hazards: hurricane (island), crossing gate (train), breakable walls (void)
const HZ={phase:'calm',t:0,dir:1,next:0,x:0,hit:new Set(),walls:[]};
function resetHazards(){HZ.phase='calm';HZ.t=0;HZ.dir=1;HZ.next=STG.hurricane?1500+rand()*600:STG.gantry?600+rand()*240:STG.stampede?500+rand()*300:0;HZ.x=0;HZ.hit=new Set();
 HZ.walls=(STG.walls||[]).map((w,k)=>w.glass?{x:w.x,top:w.top,broken:0,glass:1,gp:k?'open':'closed',gt:0,gn:k?360:420,bot:k?w.top:0}:{x:w.x,top:w.top,broken:0});
 HZ.k=0;HZ.burn=null;HZ.toastT=0;HZ.lava=150;HZ.lp='calm';HZ.lt=0;HZ.lnext=700+rand()*300;HZ.rocks=[];HZ.rnext=420+rand()*200;HZ.fw=null;HZ.fnext=300+rand()*120;HZ.cd=new Map();
 if(STG.kitchen)HZ.burn={i:-1,ph:'off',t:0,next:200};
 HZ.flood=96;HZ.fp='calm';HZ.ft=0;HZ.fnext=700+rand()*300;HZ.mist={i:1,ph:'off',t:0,next:200};HZ.vine={ph:'gone',t:0,next:150,dir:1,len:0};
 for(const p of STG.plats)if(p.vine){p.x1=-150;p.x2=-150;p.y=-9999;}
 for(const p of STG.plats){if(p.lan){p.cx0=p.lan.cx;layLantern(p,0);}if(p.toast){p.y=-58;p.vy=0;}}}
function layLantern(p,t){const l=p.lan,a=l.A*Math.sin(t*l.w+l.ph),w=p.x2-p.x1,ox=p.x1,oy=p.y;const cx=l.cx+l.L*Math.sin(a);
 p.x1=cx-w/2;p.x2=cx+w/2;p.y=-520+l.L*Math.cos(a);p.vx=p.x1-ox;p.vy=p.y-oy;p.ang=a;}
function hazHit(f,d,a,b,g,dir,key,cd){const k=f.slot+key;if((HZ.cd.get(k)||0)>frame||!canBeHit(f))return false;HZ.cd.set(k,frame+cd);launch(f,d,a,b,g,dir,null,false);f.hitlag=4;return true;}
const HERD=3;
// Watering Hole: mud at the banks, and standing water when it floods, slow your feet
function groundDrag(f,g){if(g!==STG.main)return 1;let k=1;if(STG.mud)for(const [a,b] of STG.mud)if(f.x>a&&f.x<b)k=0.55;if(STG.flood&&HZ.flood<-6)k=Math.min(k,0.72);return k;}
// Greenhouse vine: a platform that grows out from its pot, then wilts back
function layVine(p,len,dir){if(!p)return;
 if(len<16){for(const f of fighters)if(f.ground===p){f.ground=null;if(f.state!=='attack')setState(f,'air');}p.y=-9999;p.x1=p.x2=dir>0?-150:150;return;}
 p.y=-205;if(dir>0){p.x1=-150;p.x2=-150+len;}else{p.x2=150;p.x1=150-len;}}
function stepHazards(){
 HZ.k++;
 if(STG.kitchen){const B=HZ.burn;B.t++;
  if(B.ph==='off'&&B.t>=B.next){B.ph='warn';B.t=0;let n;do{n=Math.floor(rand()*STG.burners.length);}while(n===B.i);B.i=n;snd('fire',.3);}
  else if(B.ph==='warn'&&B.t>=110){B.ph='hot';B.t=0;snd('fire',.6);}
  else if(B.ph==='hot'){const bx=STG.burners[B.i];if(B.t%3===0)fxPush({k:'fire',x:bx+(rand()-.5)*80,y:-4,vx:(rand()-.5),vy:-1.5-rand()*1.5,t:0,len:22,s:7+rand()*6});
   for(const f of fighters)if(f.ground===STG.main&&Math.abs(f.x-bx)<56)hazHit(f,4,85,50,15,sgn(f.x-bx)||1,'burn',36);
   if(B.t>=240){B.ph='off';B.t=0;B.next=120+rand()*120;}}
  const p=STG.plats[0];HZ.toastT++;const T=HZ.toastT%420,oy=p.y;
  if(T<300)p.y=-58;else if(T<318)p.y=lerp(-58,-235,(T-300)/18);else p.y=lerp(-235,-58,(T-318)/102);
  if(T===300){snd('pop',.6);}p.vy=p.y-oy;p.vx=0;}
 if(STG.fireworks){for(const p of STG.plats)if(p.lan)layLantern(p,HZ.k);
  if(!HZ.fw&&HZ.k>=HZ.fnext){HZ.fw={x:(rand()-.5)*640,t:0};snd('whoosh',.4);}
  if(HZ.fw){const w=HZ.fw;w.t++;if(w.t%4===0)fxPush({k:'spark',x:w.x+(rand()-.5)*10,y:-10-w.t*2.2,t:0,len:8,s:6,col:'#ffd166'});
   if(w.t>=90){const ex=w.x,ey=-60;snd('boom',.9);shake(8);
    for(let k=0;k<26;k++){const a=k/26*Math.PI*2;fxPush({k:'spark',x:ex+Math.cos(a)*50,y:ey+Math.sin(a)*50,t:0,len:24,s:16,col:['#ff5a5f','#ffd166','#4ea8ff','#4cd47a','#ff7ac8'][k%5]});}
    for(const f of fighters){const dx=f.x-ex,dy=(f.y-f.h/2)-ey;if(dx*dx+dy*dy<90*90)hazHit(f,12,70,52,70,sgn(dx)||1,'fw',30);}
    HZ.fw=null;HZ.fnext=HZ.k+300+rand()*200;}}}
 if(STG.lava){HZ.lt++;
  if(HZ.lp==='calm'&&HZ.lt>=HZ.lnext){HZ.lp='warn';HZ.lt=0;snd('wind',.5);}
  else if(HZ.lp==='warn'&&HZ.lt>=150){HZ.lp='rise';HZ.lt=0;snd('boom',.5);}
  else if(HZ.lp==='rise'){HZ.lava=lerp(150,-45,Math.min(1,HZ.lt/120));if(HZ.lt>=120){HZ.lp='high';HZ.lt=0;}}
  else if(HZ.lp==='high'&&HZ.lt>=300){HZ.lp='fall';HZ.lt=0;}
  else if(HZ.lp==='fall'){HZ.lava=lerp(-45,150,Math.min(1,HZ.lt/140));if(HZ.lt>=140){HZ.lp='calm';HZ.lt=0;HZ.lnext=800+rand()*400;}}
  for(const f of fighters)if(!f.out&&f.state!=='respawn'&&f.y>HZ.lava+2&&Math.abs(f.x)<900){if(hazHit(f,9,90,78,30,0.0001,'lava',40)){snd('fire',.6);for(let k=0;k<6;k++)fxPush({k:'fire',x:f.x+(rand()-.5)*30,y:f.y,vx:(rand()-.5)*2,vy:-2-rand()*2,t:0,len:20,s:9});}}
  if(HZ.k>=HZ.rnext){const n=3+Math.floor(rand()*3);for(let k=0;k<n;k++){const side=rand()<0.5?-1:1;HZ.rocks.push({x:side*(520+rand()*200),y:-520-rand()*160,vx:-side*(2.6+rand()*3),vy:-1-rand()*2,r:15+rand()*6,spin:rand()*6});}snd('boom',.7);shake(6);HZ.rnext=HZ.k+420+rand()*260;}
  for(const r of HZ.rocks){r.vy+=0.17;r.x+=r.vx;r.y+=r.vy;r.spin+=0.1;if(HZ.k%3===0)fxPush({k:'fire',x:r.x,y:r.y,vx:0,vy:-0.5,t:0,len:14,s:r.r*0.5});
   for(const f of fighters){if(circRect(r.x,r.y,r.r,hurtHit(f))&&hazHit(f,8,45,40,62,sgn(r.vx)||1,'rock',30)){r.dead=true;fxPush({k:'spark',x:r.x,y:r.y,t:0,len:12,s:20,col:'#ff8a3d'});snd('hit',.6);break;}}
   for(const sf of SURF)if(r.y>sf.y&&r.y<sf.y+20&&r.x>sf.x1&&r.x<sf.x2&&r.vy>0){r.dead=true;dust(r.x,sf.y,6);fxPush({k:'spark',x:r.x,y:sf.y,t:0,len:12,s:18,col:'#ff8a3d'});}
   if(r.y>500)r.dead=true;}
  HZ.rocks=HZ.rocks.filter(r=>!r.dead);}
 if(STG.hurricane){HZ.t++;
  if(HZ.phase==='calm'&&HZ.t>=HZ.next){HZ.phase='warn';HZ.t=0;HZ.dir=rand()<0.5?-1:1;snd('wind',.6);}
  else if(HZ.phase==='warn'&&HZ.t>=180){HZ.phase='wind';HZ.t=0;snd('wind',1);}
  else if(HZ.phase==='wind'){if(HZ.t%90===0)snd('wind',.7);
   for(const f of fighters){if(f.out||['ledge','held','respawn','ledgeclimb','rope','fold'].includes(f.state))continue;
    if(f.ground)f.x+=HZ.dir*1.6;else f.vx=clamp(f.vx+HZ.dir*0.16,-6,6);}
   for(const p of projectiles)p.vx+=HZ.dir*0.04;

  case 'rope':{const Rp=STG.rope;f.noGrav=1;f.ropeV+=-(0.38/f.ropeL)*Math.sin(f.ropeA)+f.inp.x*0.0022;f.ropeV*=0.996;f.ropeA=clamp(f.ropeA+f.ropeV,-1.35,1.35);

function stepAttack(f){

 else{f.mf++;if(m.charge&&f.mf===m.charge+1)snd('swing',.35);}

 else if(!m.keepVel)friction(f);

/* ---------------- hits ---------------- */
function launch(t,d,ang,bkb,kbg,dir,att,isThrow){
 if(t.c.dmgTaken)d=Math.round(d*t.c.dmgTaken*10)/10;
 t.pct=Math.min(999,t.pct+d);t.hud=10;
 const p=t.pct,w=t.c.weight;
 let kb=((((p/10)+(p*d)/20)*(200/(w+100))*1.4+18)*kbg/100)+bkb;
 if(ang===361)ang=(t.ground&&kb<32)?0:44;
 if(t.armor&&!isThrow&&kb<130){t.flash=6;return 'armor';}
 let rad=ang*Math.PI/180,lx=Math.cos(rad)*dir,ly=-Math.sin(rad);

  const px=-ly,py=lx,dot=t.inp.x*px+t.inp.y*py;lx+=px*dot*0.32;ly+=py*dot*0.32;const m=Math.hypot(lx,ly);lx/=m;ly/=m;}

 if(t.state==='ledge'||t.state==='ledgeclimb')t.ledge=null;
 t.kvx=lx*v;t.kvy=ly*v;t.vx=0;t.vy=0;t.ff=false;
 t.hitstun=Math.floor(kb*0.4);t.tumble=kb>80;t.tumbling=false;
 if(t.ground){if(t.kvy<-0.3)t.ground=null;else if(t.kvy>0&&kb>40){t.kvy=-t.kvy*0.8;t.ground=null;}else t.kvy=0;}
 t.move=null;t.armor=false;setState(t,'hitstun');t.upB=false;t.sideB=false;
 if(att&&att!==t){t.lastHit=att;t.lastHitF=frame;}
 if(kb>110||STG.kbMul)shake(Math.min(STG.kbMul?22:14,kb/(STG.kbMul?8:14)));
 if(STG.fold&&t.pct>=STG.fold){t.move=null;setState(t,'fold');t.kvx*=0.3;t.kvy*=0.3;snd('fold',.9);}

}
function hitTarget(att,t,hb,hx,hy,mul,proj){
 if(hb.wind){const dir=sgn(t.x-att.x)||att.face;t.kvx=clamp(t.kvx+dir*hb.wind*0.45,-hb.wind*2.2,hb.wind*2.2);if(!t.ground&&t.kvy>-1)t.kvy-=0.15;
  if(hb.d){t.pct=Math.min(999,t.pct+hb.d);t.hud=4;att.dmgDone+=hb.d;}if(frame%4===0)fxPush({k:'water',x:hx,y:hy,vx:dir*2,vy:-0.5,t:0,len:12,s:6});return;}
 const d=Math.round(hb.d*mul);
 if(t.state==='shield'||t.state==='shieldstun'){shieldHit(att,t,d,hx,proj);return;}
 if(t.drum&&!proj&&(sgn(att.x-t.x)||t.face)===t.face){drumBlock(att,t,hx,hy);return;}
 const dir=proj?sgn(proj.vx)||1:hb.pull?-(sgn(t.x-att.x)||att.face):hb.dir==='rev'?-att.face:hb.dir==='away'?(sgn(t.x-att.x)||att.face):att.face;
 const wasBubble=t.state==='bubbled';
 const r=launch(t,d,hb.a,hb.b,hb.g,dir,att,false);
 att.dmgDone+=d;
 if(hb.stun&&r!=='armor'&&t.ground){setState(t,'dizzy');t.dizzyLen=hb.stun;t.kvx*=0.3;t.kvy=0;t.hitstun=0;}
 const hl=Math.floor(d/3)+3+(wasBubble?6:0);t.hitlag=hl;if(!proj){att.hitlag=hl;}
 if(wasBubble){snd('pop',.8);fxPush({k:'ring',x:t.x,y:t.y-t.h/2,t:0,len:14,s:t.h,col:'#ffffff'});}
 fxPush({k:'spark',x:hx,y:hy,t:0,len:10+d*0.4,s:10+d*1.6,col:r==='armor'?'#b6ff3c':null});

}
function shieldHit(att,t,d,hx,proj){

 t.vx=dir*(0.18*d+1.2);setState(t,'shieldstun');t.lagLen=Math.floor(d*0.45)+3;
 const hl=Math.floor(d/3)+2;t.hitlag=hl;if(!proj){att.hitlag=hl;if(att.ground)att.vx=-dir*0.9;}
 snd('shield',.5);fxPush({k:'ring',x:hx,y:t.y-t.h/2,t:0,len:10,s:18,col:t.col});

function drumPos(t){return t.reflect?{x:t.x+t.face*46,y:t.y-t.h*0.5,r:36}:{x:t.x+t.face*22,y:t.y-t.h*0.58,r:24};}

 if(att.ground){startLag(att,18);att.vx=dir*4.5;}else{setState(att,'air');att.vx=dir*4;att.vy=-3;}

}
function reflect(p,t){p.vx=-p.vx*1.2;p.owner=t;p.t=0;if(p.hb)p.hb={...p.hb,d:Math.round(p.hb.d*1.3)};snd('clang',.6);fxPush({k:'ring',x:p.x,y:p.y,t:0,len:12,s:24,col:'#e8f4ff'});}

}
function shieldBreak(f){
 f.shield=30;setState(f,'shieldbreak');f.ground=null;f.vy=-10;f.vx=0;f.dizzyLen=clamp(400-f.pct*2,120,400);
 snd('boom',.6);shake(8);fxPush({k:'ring',x:f.x,y:f.y-f.h/2,t:0,len:24,s:70,col:f.col});
}
function hurt(t){return{x1:t.x-t.w/2,x2:t.x+t.w/2,y1:t.y-t.h,y2:t.y};}
function hurtHit(t){return{x1:t.x-t.w/2,x2:t.x+t.w/2,y1:t.y-t.h*(t.low?0.45:1),y2:t.y};}

function canBeHit(t){return !t.out&&t.inv<=0&&!t.intan&&t.state!=='respawn'&&t.state!=='ledgeclimb'&&t.state!=='fold';}
function processHits(){
 for(const f of fighters){
  if(f.out||f.hitlag>0||f.lagged||f.state!=='attack'||!f.move)continue;
  const m=f.move,mul=m.charge?1+0.4*f.chargeT/60:m.cm?(f.cmul||1):1;
  if(m.gb){const g=m.gb;if(f.mf>=g.s&&f.mf<=g.e){const hx=f.x+f.face*g.x,hy=f.y-f.h/2+g.y;
    for(const t of fighters){if(t===f||!canBeHit(t)||t.state==='held'||t.state==='lying'||t.state==='bubbled')continue;
     if(!t.ground&&t.y<(f.ground?f.ground.y:f.y)-30)continue;
     if(circRect(hx,hy,g.r,hurtHit(t))){startHold(f,t);placeHeld(f);break;}}}}
  if(!m.hb)continue;
  for(const hb of m.hb){
   if(f.mf<hb.s||f.mf>hb.e)continue;
   const sc=hb.fuel?0.55+0.45*f.fuel/100:1;
   const hx=f.x+f.face*hb.x*sc,hy=f.y-f.h/2+hb.y,hr=hb.r*sc;
   for(const t of fighters){
    if(t===f||!canBeHit(t))continue;
    const key=t.slot*10+(hb.grp||0),last=f.hitSet.get(key);

    const sh=t.state==='shield'||t.state==='shieldstun';
    const hit=sh?((hx-t.x)**2+(hy-(t.y-t.h/2))**2<=(hr+shieldR(t))**2):circRect(hx,hy,hr,hurtHit(t))||(t.drum&&drumHit(t,hx,hy,hr));

   }
   if(f.move!==m)break;
  }
 }
}
function shieldR(f){return (Math.max(f.w,f.h)*0.55+6)*(0.45+0.55*f.shield/60);}

/* ---------------- physics ---------------- */
function canFallOff(f){return ['idle','walk','dash','run','crouch','hitstun','land','tech','getup','roll','lying','dizzy','shieldstun'].includes(f.state)&&f.state!=='land'||(f.state==='attack'&&f.move&&f.move.offEdge);}
function physics(f){
 if(['ledge','held','respawn','ledgeclimb','rope','fold'].includes(f.state))return;
 if(f.kvx||f.kvy){const m=Math.hypot(f.kvx,f.kvy),nm=Math.max(0,m-0.188);if(nm===0){f.kvx=f.kvy=0;}else{f.kvx*=nm/m;f.kvy*=nm/m;}}

 const px=f.x,py=f.y;
 if(f.ground){
  f.kvy=0;f.x+=f.vx*groundDrag(f,f.ground)+f.kvx+(f.ground.vx||0);f.y=f.ground.y;
  if(f.kvx){const t=f.c.traction*(f.slickT>0?0.15:1);if(Math.abs(f.kvx)<=t)f.kvx=0;else f.kvx-=sgn(f.kvx)*t;}
  const g=f.ground;
  if(f.x<g.x1||f.x>g.x2){
   if(canFallOff(f)||g.soft&&!['land','shield','attack'].includes(f.state)){f.ground=null;
    if(['idle','walk','dash','run','crouch','tech','getup','roll','lying','dizzy','shieldstun'].includes(f.state)){setState(f,'air');}}
   else{f.x=clamp(f.x,g.x1,g.x2);f.vx=0;f.kvx=0;}
  }

   let gone=p.t>=p.len||p.owner.out;
   for(const t of fighters){if(gone)break;if(t===p.owner||!canBeHit(t)||t.state==='held'||t.state==='bubbled')continue;
    const sh=t.state==='shield'||t.state==='shieldstun';
    if(sh){if((p.x-t.x)**2+(p.y-(t.y-t.h/2))**2<=(p.r+shieldR(t))**2){shieldHit(p.owner,t,4,p.x,p);gone=true;snd('pop',.4);}continue;}
    if((t.drum||t.reflect)&&drumHit(t,p.x,p.y,p.r)&&sgn(p.vx)===-t.face){reflect(p,t);continue;}

     if(t.holder){const h=t.holder;h.held=null;t.holder=null;setState(h,'idle');}

     if(t.state==='ledge')t.ledge=null;
     t.move=null;t.armor=false;setState(t,'bubbled');t.ground=null;t.bubbleT=Math.min(140,40+t.pct*0.6);t.vx=p.vx*0.3;t.vy=0;t.kvx=t.kvy=0;t.ff=false;
     t.lastHit=p.owner;t.lastHitF=frame;snd('pop',.7);gone=true;}
   }
   if(gone){projectiles.splice(k,1);fxPush({k:'ring',x:p.x,y:p.y,t:0,len:10,s:p.r*1.4,col:'#ffffff'});}
  }
  else if(p.k!=='bubble'){const py=p.y;p.vy+=p.k==='coconut'?0.28:p.g;p.x+=p.vx;p.y+=p.vy;p.bounce=p.bounce||0;

   let gone=p.t>=p.len||p.bounce>=3||p.owner.out||p.y>STG.blast.b;
   for(const t of fighters){if(gone)break;if(t===p.owner||!canBeHit(t))continue;
    if((t.drum||t.reflect)&&drumHit(t,p.x,p.y,p.r)&&sgn(p.vx)===-t.face){reflect(p,t);continue;}
    const sh=t.state==='shield'||t.state==='shieldstun';
    if(sh){if((p.x-t.x)**2+(p.y-(t.y-t.h/2))**2<=(p.r+shieldR(t))**2){shieldHit(p.owner,t,p.hb.d,p.x,p);gone=true;}continue;}

 }
 for(let k=puddles.length-1;k>=0;k--){const q=puddles[k];q.t++;

 const mr=new MediaRecorder(stream),chunks=[];VOX.rec=mr;mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
 mr.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());VOX.rec=null;try{const ab=await AC.decodeAudioData(await new Blob(chunks).arrayBuffer());const wav=encodeWav(ab);
   if(!wav){onDone('Too quiet, try again closer to the mic.');return;}const b=bufToB64(wav);VOX.raw[id]=b;try{localStorage.setItem(voxKey(id),b);}catch(e){}
   VOX.mine[id]=await decodeB64(b);if(NET.connected)sendVoice(id);onDone(null);}catch(e){onDone('Could not read the recording.');}};

function sendVoice(id){const b=VOX.raw[id];if(!b)return;const N=48000,n=Math.ceil(b.length/N);for(let k=0;k<n;k++)VOX.outQ.push({t:'vox',id,i:k,n,d:b.slice(k*N,(k+1)*N)});pumpVox();}

 if(me){const i=humanInput(me);me.prev=me.inp;me.inp=i;sendInput(i);}
 // render a little behind the newest update and blend between updates, so uneven arrival doesn't stutter
 const S=NET.snaps;if(S.length){const tF=NET.lastF+(frame-NET.lastFL)-6;
  let a=null,b=null;for(let k=0;k<S.length;k++){if(S[k].f<=tF)a=S[k];else{b=S[k];break;}}
  if(!a){a=S[0];b=null;}
  if(a!==NET.applied){applySnap(a);NET.applied=a;}else applyDiscreteless(a);
  if(b&&b.f>a.f)blendSnap(a,b,(tF-a.f)/(b.f-a.f));
  while(S.length>2&&S[1].f<tF-30)S.shift();}
 stepFX();
}
const FX_I=FK.indexOf('x');
function applyDiscreteless(a){a.F.forEach((q,k)=>{const f=fighters[k];if(f){f.x=q[FX_I];f.y=q[FX_I+1];}});}
function blendSnap(a,b,k){k=clamp(k,0,1);
 a.F.forEach((q,i)=>{const f=fighters[i],r=b.F[i];if(!f||!r)return;
  const X=FX_I;if(Math.abs(r[X]-q[X])>200||Math.abs(r[X+1]-q[X+1])>200)return;f.x=lerp(q[X],r[X],k);f.y=lerp(q[X+1],r[X+1],k);});
 if(a.P.length===b.P.length)projectiles.forEach((p,i)=>{const q=a.P[i],r=b.P[i];if(q[0]===r[0]){p.x=lerp(q[1],r[1],k);p.y=lerp(q[2],r[2],k);}});
 if(a.M&&b.M)for(const m of MOV.list){const r=b.M.find(z=>z[3]===m.id),q=a.M.find(z=>z[3]===m.id);if(q&&r){m.x1=lerp(q[0],r[0],k);m.x2=lerp(q[1],r[1],k);m.y=lerp(q[2],r[2],k);}}
}

function setPause(on,send){
 if(!G)return;G.paused=on;clearTouch();if(G.net&&send)netSend({t:'pause',on});musicSync();
 if(on){showMenu(`<h2>PAUSED</h2>${G.net?'<div class="note">Paused for both players.</div>':''}<button class="btn" id="rs">RESUME</button>${G.training?'<button class="btn alt" id="rt">RESET %</button>':''}<button class="btn alt" id="qt">QUIT</button>`,true);
  bind('#rs',()=>setPause(false,true));
  bind('#qt',()=>{if(G.net){netSend({t:'bye'});NET.closing=true;setTimeout(netReset,250);}G.paused=false;titleScreen();});
  bind('#rt',()=>{fighters.forEach(f=>{f.pct=0;});setPause(false,true);});}
 else hideMenu();
}
function showResults(){
 if(G.net==='guest')return;
 const {arr,tied}=ranking();
 if(tied&&!G.sd){const slots=[0,1,2,3].map(k=>{const f=tied.find(t=>t.slot===k);return f?{...f.cfg}:{type:'off'};});const last=G.lastSlots,lr=G.lastRules,ln=G.lastNet;
  if(G.net==='host'){launchNet({rules:{stocks:1,time:0},stage:G.stage,slots,sd:true,pct:300});G.lastNet=ln;return;}
  startMatch({sd:true,rules:{stocks:1,time:0},slots,pct:300,stage:G.stage});G.lastSlots=last;G.lastRules=lr;return;}
 G.paused=true;
 const rows=arr.map(f=>({slot:f.slot,col:f.col,cpu:f.cpu,lvl:f.lvl,id:f.id,kos:f.kos,falls:f.falls,sds:f.sds,dmg:Math.round(f.dmgDone)}));
 if(G.net==='host'){netSend({t:'res',rows,sd:G.sd});renderResults(rows,G.sd,'host');}else renderResults(rows,G.sd,'local');
}
function renderResults(rows,sd,mode){
 if(G)G.paused=true;
 const nm=r=>r.cpu?'CPU '+r.lvl:(mode==='local'?'P'+(r.slot+1):(r.slot===(mode==='host'?0:1)?'YOU':'P'+(r.slot+1)));
 const w=rows[0];
 const html=rows.map((r,k)=>`<div class="r" style="border-left:6px solid ${r.col}"><div class="pl">${k+1}</div><canvas width="96" height="96" data-res="${r.slot}" data-char="${r.id}" style="position:static;width:44px;height:44px"></canvas>
  <div class="nmx">${nm(r)} · ${CHARS[r.id].name}</div><div class="st">KOs ${r.kos} · Falls ${r.falls}${r.sds?' (SD '+r.sds+')':''} · Dmg ${r.dmg}</div></div>`).join('');
 const btns=mode==='local'?'<button class="btn" id="again">REMATCH</button><button class="btn alt" id="ch">FIGHTERS</button><button class="btn alt sm" id="tt">TITLE</button>'
  :mode==='host'?'<button class="btn" id="again">REMATCH</button><button class="btn alt" id="lb">LOBBY</button><button class="btn alt sm" id="lv">LEAVE</button>'
  :'<div class="note">Waiting for the host…</div><button class="btn alt sm" id="lv">LEAVE</button>';
 showMenu(`<h2>${nm(w)==='YOU'?'YOU WIN!':nm(w)+' WINS!'}</h2><div class="note">${CHARS[w.id].name} takes it${sd?' in sudden death':''}.</div><div class="res">${html}</div><div class="row">${btns}</div>`,true);
 menu.querySelectorAll('canvas[data-res]').forEach(c=>{const r=rows.find(q=>q.slot===+c.dataset.res);drawPortraitSafe(c,c.dataset.char,r.col);});
 if(mode==='local'){const ls=G.lastSlots,lr=G.lastRules,st=G.stage;
  bind('#again',()=>{startMatch({rules:lr||undefined,slots:ls||setup.slots,stage:st});G.lastSlots=ls;G.lastRules=lr;hideMenu();clearTouch();});
  bind('#ch',versusScreen);bind('#tt',titleScreen);}
 else{
  bind('#again',hostStart);
  bind('#lb',()=>{netSend({t:'tolobby',l:lobbyState()});onlineLobby();});
  bind('#lv',()=>{netSend({t:'bye'});NET.closing=true;setTimeout(netReset,250);titleScreen();});}
}
// portrait drawing using the shared drawing functions on another canvas
function drawPortraitSafe(canvas,id,slot){
 const x=canvas.getContext('2d'),s=canvas.width;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,s,s);
 const pc=typeof slot==='string'?slot:PCOL[slot];x.fillStyle=pc+'40';x.beginPath();x.arc(s/2,s/2,s/2-2,0,7);x.fill();
 const real=ctx;ctx=x;
 try{const k=s/64;x.translate(s/2,s*0.8);const P=PORT[id],sc=P.s*1.15;x.scale(k*sc,k*sc);x.translate(P.dx,P.dy);
  const fake={id,c:CHARS[id],state:'idle',sf:0,face:1,flash:0,mf:0,slot:0,col:typeof slot==='string'?slot:PCOL[slot],fuel:100,move:null};
  drawChar(fake,null);}finally{ctx=real;}
}

/* ---------------- boot ---------------- */
window.SKY={startMatch,stepGame,get G(){return G},get fighters(){return fighters},setup,MOVES,CHARS,
 sim(n){for(let k=0;k<n;k++){stepGame();if(G.paused)break;}},NET,get projectiles(){return projectiles},togglePause,showResults};
titleScreen();
{const jc=(new URLSearchParams(location.search).get('join')||'').toUpperCase();if(/^[A-Z]{4}$/.test(jc)){history.replaceState(null,'',location.pathname);joinOnline(jc);}}

requestAnimationFrame(loop);
</script>
