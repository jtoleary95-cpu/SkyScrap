<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2338">
<title>Sky Scrap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2338;--panel:#24304d;--panel2:#2f3d61;--hi:#ffd166;--txt:#f4f1ea;--dim:#9aa6c4;--p1:#ff5a5f;--p2:#4ea8ff;--p3:#ffc93c;--p4:#4cd47a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--txt);font-family:'Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#menu.on{pointer-events:auto}
.scr{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 14px;height:100%;overflow:auto;width:100%}
.scr>.in{margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.bar{display:flex;align-items:center;justify-content:space-between;width:min(860px,100%);gap:10px}
.vs{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;width:min(860px,100%);align-items:start}
.vs .card{width:100%}
@media (max-width:640px){.vs{grid-template-columns:1fr}}
.dim{background:rgba(15,20,35,.72)}
.logo{font-size:min(15vw,96px);line-height:.9;font-weight:800;letter-spacing:2px;color:#fff;text-shadow:0 5px 0 #c2403d,0 9px 0 #1b2338,0 0 30px rgba(255,209,102,.5);transform:rotate(-3deg);margin:4px 0 10px;text-align:center}
.logo small{display:block;font-size:.32em;color:var(--hi);text-shadow:0 3px 0 #1b2338;letter-spacing:6px}
.btn{pointer-events:auto;font:inherit;font-weight:800;font-size:22px;color:var(--ink);background:var(--hi);border:0;border-radius:16px;padding:8px 28px;min-width:220px;box-shadow:0 5px 0 #b8892a;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8892a}
.btn.alt{background:#e8ecf7;box-shadow:0 5px 0 #8f9bb9}
.btn.off{background:#4b5675;color:#8d97b3;box-shadow:0 5px 0 #323a52}
.btn.sm{font-size:17px;min-width:0;padding:5px 16px;border-radius:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{background:var(--panel);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 #141a2b;width:min(680px,100%)}
.card h3{margin:0 0 6px;font-size:16px;color:var(--dim);letter-spacing:2px}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{background:var(--panel2);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent}
.slot.off{opacity:.45}
.slot .tag{font-weight:800;font-size:15px;border-radius:8px;padding:0 10px;color:#fff;width:100%;text-align:center;cursor:pointer}
.slot canvas{position:static;width:min(58px,11vh);height:min(58px,11vh);cursor:pointer}
.slot .nm{font-weight:800;font-size:16px;cursor:pointer;line-height:1.1}
.slot .lv{display:flex;gap:4px;align-items:center;font-size:14px;white-space:nowrap}
.slot .lv b{background:#46557f;border-radius:8px;width:26px;text-align:center;cursor:pointer}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;font-size:16px;font-weight:600;flex-wrap:wrap}
.seg{display:flex;gap:4px}
.seg b{background:#46557f;border-radius:10px;padding:2px 12px;cursor:pointer;font-weight:800}
.seg b.on{background:var(--hi);color:var(--ink)}
.stg{display:flex;flex-direction:column;gap:5px}
.stg div{background:var(--panel2);border-radius:12px;padding:3px 10px;font-weight:800;border:3px solid transparent;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.stg div.on{border-color:var(--hi)}
.stg div.lock{opacity:.4;cursor:default}
.stg small{font-weight:600;color:var(--dim);font-size:12px}
.res{width:min(680px,100%);display:flex;flex-direction:column;gap:6px}
.res .r{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:6px 12px;font-size:17px}
.res .pl{font-size:26px;font-weight:800;width:44px}
.res .nmx{flex:1;font-weight:800}
.res .st{color:var(--dim);font-size:14px}
h2{margin:0;font-size:36px;color:var(--hi);text-shadow:0 3px 0 #1b2338}
#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--ink);font-size:24px;font-weight:800;text-align:center;padding:20px;z-index:9}
@media (orientation:portrait) and (max-width:900px){#rot{display:flex}}
.ph{font-size:60px;animation:tilt 1.6s ease-in-out infinite}
@keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
.note{color:var(--dim);font-size:14px;text-align:center;max-width:560px}
</style>
</head>

const PLAYABLE=['mochi','gorbo'];

const MOVES={mochi:{

for(const ch in MOVES)for(const k in MOVES[ch])MOVES[ch][k].name=k;

/* ---------------- game state ---------------- */
let G=null; // current match
let fighters=[],projectiles=[],puddles=[],FX=[];
let frame=0;
const cam={x:0,y:-80,z:1,sx:0,sy:0,shake:0};

function blank(){return{x:0,y:0,a:0,b:0,j:0,s:0,z:0,smash:0};}
function fxPush(o){if(FX.length<400)FX.push(o);}
function dust(x,y,n){for(let i=0;i<n;i++)fxPush({k:'dust',x:x+(rand()-.5)*30,y:y-2,vx:(rand()-.5)*3,vy:-rand()*1.5,t:0,len:20+rand()*12,s:5+rand()*6});}

function makeFighter(slot,cfg,rules){
 const c=CHARS[cfg.char];
 const f={slot,cfg,c,id:cfg.char,cpu:cfg.type==='cpu',lvl:cfg.lvl||5,dummy:!!cfg.dummy,tapJump:cfg.type==='human'&&setup.tapJump,

}
function setState(f,s){f.state=s;f.sf=0;}

/* ---------------- input ---------------- */
const keys=new Set();
addEventListener('keydown',e=>{if(e.repeat)return;keys.add(e.code);unlockAudio();if(e.code==='Escape'&&G&&!G.attract)togglePause();
 if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>keys.delete(e.code));
const touch={stick:null,base:{x:0,y:0},pos:{x:0,y:0},btn:{a:null,b:null,j:null,s:null,z:null},used:false};
let lastPad=null;
function keyInput(){
 const k=keys,i=blank();
 const L=k.has('ArrowLeft')||k.has('KeyA'),R=k.has('ArrowRight')||k.has('KeyD'),U=k.has('ArrowUp')||k.has('KeyW'),D=k.has('ArrowDown')||k.has('KeyS');
 const m=(k.has('ShiftLeft')||k.has('ShiftRight'))?0.55:1;
 i.x=((R?1:0)-(L?1:0))*m;i.y=((D?1:0)-(U?1:0))*m;
 i.a=k.has('KeyJ')?1:0;i.b=k.has('KeyK')?1:0;i.j=k.has('Space')||k.has('KeyI')?1:0;i.s=k.has('KeyL')?1:0;i.z=k.has('KeyU')?1:0;
 return i;
}
function padInput(){
 const pads=navigator.getGamepads?navigator.getGamepads():[];let p=null;for(const q of pads)if(q){p=q;break;}
 if(!p)return null;const i=blank(),dz=v=>Math.abs(v)<0.18?0:v;
 i.x=dz(p.axes[0]||0);i.y=dz(p.axes[1]||0);
 const bt=n=>p.buttons[n]&&p.buttons[n].pressed?1:0;
 if(bt(14))i.x=-1;if(bt(15))i.x=1;if(bt(12))i.y=-1;if(bt(13))i.y=1;
 // GameCube-style: A=0, B=1 or 2, X/Y jump, L/R shield, bumpers grab
 i.a=bt(0);i.b=bt(1)?1:0;i.j=bt(2)||bt(3)?1:0;
 i.s=(bt(6)||bt(7)||((p.buttons[6]&&p.buttons[6].value>0.4)||(p.buttons[7]&&p.buttons[7].value>0.4)))?1:0;
 i.z=bt(4)||bt(5)?1:0;
 const cx=p.axes[2]||0,cy=p.axes[3]||0,cm=Math.hypot(cx,cy);
 i.cx=cm>0.7?cx:0;i.cy=cm>0.7?cy:0;
 return i;
}
let cHeld=false;
function humanInput(f){
 const i=keyInput();
 if(touch.stick!==null){const R=stickR();let dx=(touch.pos.x-touch.base.x)/R,dy=(touch.pos.y-touch.base.y)/R;const m=Math.hypot(dx,dy);
  if(m>1){dx/=m;dy/=m;}if(m>0.14){i.x=dx;i.y=dy;}}
 for(const k of ['a','b','j','s','z'])if(touch.btn[k]!==null)i[k]=1;
 const p=padInput();
 if(p){if(Math.abs(p.x)>Math.abs(i.x))i.x=p.x;if(Math.abs(p.y)>Math.abs(i.y))i.y=p.y;for(const k of ['a','b','j','s','z'])i[k]=i[k]||p[k];
  // C-stick = instant smash / aerial
  if(p.cx||p.cy){if(!cHeld){cHeld=true;i.smash=1;i.a=1;f.prev.a=0;
    if(Math.abs(p.cx)>Math.abs(p.cy)){i.x=sgn(p.cx);i.y=0;}else{i.y=sgn(p.cy);i.x=0;}}}else cHeld=false;}
 return i;
}
const pr=(f,k)=>f.inp[k]&&!f.prev[k];
function updateFlicks(f){
 const i=f.inp;f.hist.push({x:i.x,y:i.y});if(f.hist.length>5)f.hist.shift();
 f.flickT++;
 const h=f.hist,n=h.length;
 const wasX=n>1&&h.slice(Math.max(0,n-4),n-1).some(q=>Math.abs(q.x)<0.3),wasY=n>1&&h.slice(Math.max(0,n-4),n-1).some(q=>Math.abs(q.y)<0.3);
 const prevX=n>1?Math.abs(h[n-2].x):0,prevY=n>1?Math.abs(h[n-2].y):0;
 if(i.smash){ if(Math.abs(i.x)>=Math.abs(i.y)&&i.x){f.flickT=0;f.flickX=sgn(i.x);f.flickY=0;} else if(i.y){f.flickT=0;f.flickY=sgn(i.y);f.flickX=0;} return; }
 if(Math.abs(i.x)>=0.78&&prevX<0.78&&wasX&&Math.abs(i.x)>=Math.abs(i.y)*0.8){f.flickT=0;f.flickX=sgn(i.x);f.flickY=0;}
 else if(Math.abs(i.y)>=0.78&&prevY<0.78&&wasY){f.flickT=0;f.flickY=sgn(i.y);f.flickX=0;}
}

/* ---------------- moves ---------------- */
function startMove(f,name){
 const m=MOVES[f.id][name];if(!m){return;}
 f.move=m;f.mf=0;f.chargeT=0;f.hitSet.clear();setState(f,'attack');f.tumbling=false;
 if(name==='nb'&&f.id==='gorbo'&&f.fuel<10){f.move=MOVES.gorbo.nbend;}
 if(!m.charge)snd('swing',.25);
}
function endMove(f){
 const m=f.move;f.armor=false;f.move=null;
 if(f.ground)setState(f,'idle');else setState(f,m&&m.helpless?'special_fall':'air');
}
function groundAttack(f){
 const i=f.inp;const sd=f.flickT<=5?{x:f.flickX,y:f.flickY}:null;
 if(f.state==='dash'||f.state==='run'){
  if(sd&&sd.y<0){startMove(f,'usmash');return;}
  if(sd&&sd.x&&f.state==='dash'&&f.sf<5){f.face=sd.x;startMove(f,'fsmash');return;}
  startMove(f,'dash');return;}
 if(sd){if(sd.y<0)startMove(f,'usmash');else if(sd.y>0)startMove(f,'dsmash');else{f.face=sd.x;startMove(f,'fsmash');}return;}
 const ax=Math.abs(i.x),ay=Math.abs(i.y);
 if(ay>ax&&ay>0.4){startMove(f,i.y<0?'utilt':'dtilt');return;}
 if(ax>0.35){f.face=sgn(i.x);startMove(f,'ftilt');return;}
 startMove(f,'jab');
}
function aerial(f){
 const i=f.inp;let x=i.x,y=i.y;
 if(f.flickT<=4){if(f.flickX){x=f.flickX;y=0;}else if(f.flickY){y=f.flickY;x=0;}}
 const ax=Math.abs(x),ay=Math.abs(y);
 if(ay>=ax&&ay>0.45)startMove(f,y<0?'uair':'dair');
 else if(ax>0.35)startMove(f,x*f.face>0?'fair':'bair');
 else startMove(f,'nair');
}
function special(f){
 const i=f.inp,ax=Math.abs(i.x),ay=Math.abs(i.y);
 if(ay>ax&&i.y<-0.45){if(!f.ground&&f.upB)return false;f.upB=true;startMove(f,'ub');return true;}
 if(ay>ax&&i.y>0.45){startMove(f,'db');return true;}
 if(ax>0.45){f.face=sgn(i.x);if(!f.ground){if(f.sideB)return false;f.sideB=true;}startMove(f,'sb');return true;}
 startMove(f,'nb');return true;
}
function spawnBubble(f){
 if(projectiles.some(p=>p.owner===f&&p.k==='bubble'))return;
 projectiles.push({k:'bubble',owner:f,x:f.x+f.face*28,y:f.y-f.h/2-4,vx:f.face*3.6,vy:0,t:0,len:95,r:16});snd('pop',.4);
}
function makePuddle(f){
 if(!f.ground)return;
 for(let i=puddles.length-1;i>=0;i--)if(puddles[i].owner===f)puddles.splice(i,1);
 const s=f.ground;puddles.push({owner:f,surf:s,x1:Math.max(s.x1,f.x-62),x2:Math.min(s.x2,f.x+62),y:s.y,t:0,len:360});
}
function startLag(f,n){setState(f,'land');f.lagLen=n;f.move=null;f.armor=false;}
function startJumpsquat(f){setState(f,'jumpsquat');f.move=null;}
function roll(f,dir){setState(f,'roll');f.rollDir=dir;f.move=null;}

/* ---------------- state step ---------------- */
function tryGround(f){
 const tapUp=f.tapJump&&f.flickT===0&&f.flickY<0;
 if(pr(f,'j')||tapUp){startJumpsquat(f);return true;}
 if(f.inp.s){if(f.flickT<=1&&f.flickX){roll(f,f.flickX);return true;}setState(f,'shield');return true;}
 if(pr(f,'z')){startMove(f,'grab');return true;}
 if(pr(f,'a')){groundAttack(f);return true;}
 if(pr(f,'b')){special(f);return true;}
 return false;
}
function tryAir(f){
 const tapUp=f.tapJump&&f.flickT===0&&f.flickY<0;
 if((pr(f,'j')||tapUp)&&f.jumps>0){f.jumps--;f.vy=-f.c.ajump;f.vx=f.inp.x*f.c.airSpd;f.ff=false;f.tumbling=false;setState(f,'air');snd('jump',.25);
  if(f.id==='mochi')fxPush({k:'ring',x:f.x,y:f.y,t:0,len:14,s:22,col:'#ffffff'});return true;}
 if(pr(f,'s')){airdodge(f);return true;}
 if(pr(f,'a')){aerial(f);return true;}
 if(pr(f,'b')){return special(f);}
 return false;
}
function airdodge(f){
 setState(f,'airdodge');f.move=null;f.tumbling=false;f.ff=false;
 let x=f.inp.x,y=f.inp.y;const m=Math.hypot(x,y);
 if(m>0.3){x/=m;y/=m;f.vx=x*10.5;f.vy=y*10.5;}else{f.vx*=0.2;f.vy=0;}
}
function friction(f,mul){const t=f.c.traction*(mul||1);if(Math.abs(f.vx)<=t)f.vx=0;else f.vx-=sgn(f.vx)*t;}
function airDrift(f,mul){
 mul=mul||1;const c=f.c,x=f.inp.x;
 if(Math.abs(x)>0.2){const tx=x*c.airSpd*mul;if(f.vx<tx)f.vx=Math.min(tx,f.vx+c.airAcc);else if(f.vx>tx&&sgn(x)===sgn(f.vx)){/*keep momentum*/}else if(f.vx>tx)f.vx=Math.max(tx,f.vx-c.airAcc);}
 else{if(Math.abs(f.vx)<=c.airFric)f.vx=0;else f.vx-=sgn(f.vx)*c.airFric;}
}
function fastFall(f){if(!f.ground&&f.vy>=-0.5&&f.flickT===0&&f.flickY>0&&!f.ff){f.ff=true;f.vy=f.c.ffall;}}

function groundMove(f){
 if(tryGround(f))return;
 const c=f.c,x=f.inp.x,ax=Math.abs(x);
 if(f.ground.soft&&f.flickT===0&&f.flickY>0){f.ground=null;f.dropT=12;f.y+=2;setState(f,'air');return;}
 if(f.state==='dash'){
  if(f.sf===1)f.vx=f.face*c.dash;
  if(f.flickT===0&&f.flickX&&f.flickX!==f.face){f.face=f.flickX;setState(f,'dash');f.vx=f.face*c.dash;return;}
  if(f.sf>=12){if(ax>0.6&&sgn(x)===f.face)setState(f,'run');else setState(f,'idle');}
  return;}
 if(f.state==='run'){
  if(ax>0.6&&sgn(x)===f.face){f.vx=f.face*c.run;return;}
  if(ax>0.6){f.face=sgn(x);f.vx*=0.4;setState(f,'dash');return;}
  setState(f,'idle');}
 if(f.flickT===0&&f.flickX){f.face=f.flickX;setState(f,'dash');f.vx=f.face*c.dash;dust(f.x,f.y,3);return;}
 if(f.inp.y>0.6&&ax<0.5){if(f.state!=='crouch')setState(f,'crouch');friction(f);return;}
 if(ax>0.22){f.face=sgn(x);if(f.state!=='walk')setState(f,'walk');const tv=x*c.walk;f.vx+=clamp(tv-f.vx,-0.5,0.5);}
 else{if(f.state!=='idle')setState(f,'idle');friction(f);}
}

function stepFighter(f){
 if(f.out)return;
 updateFlicks(f);
 if(f.hitlag>0){f.hitlag--;return;}
 f.sf++;f.noGrav=0;f.intan=false;
 if(f.inv>0)f.inv--;if(f.ledgeCD>0)f.ledgeCD--;if(f.dropT>0)f.dropT--;if(f.pumT>0)f.pumT--;if(f.flash>0)f.flash--;if(f.lc>0)f.lc--;
 f.lcT++;f.sT++;if(pr(f,'s')){f.lcT=0;f.sT=0;}
 if(f.state!=='shield'&&f.state!=='shieldstun')f.shield=Math.min(60,f.shield+0.07);
 if(f.id==='gorbo'&&!(f.state==='attack'&&f.move&&f.move.name==='nb'))f.fuel=Math.min(100,f.fuel+0.35);
 const i=f.inp,c=f.c;
 switch(f.state){
  case 'idle':case 'walk':case 'dash':case 'run':case 'crouch':
   if(!f.ground){setState(f,'air');break;}groundMove(f);break;
  case 'jumpsquat':
   if(pr(f,'a')&&f.inp.y<-0.3){startMove(f,'usmash');break;}
   if(pr(f,'b')){special(f);break;}
   friction(f,0.5);
   if(f.sf>=c.jsq){const held=i.j||(f.tapJump&&i.y<-0.5);f.ground=null;f.vy=-(held?c.jump:c.hop);
    f.vx=clamp(f.vx*0.7+i.x*c.airSpd*0.6,-c.airSpd*1.1,c.airSpd*1.1);f.y-=1;setState(f,'air');snd('jump',.2);dust(f.x,f.y+1,4);}
   break;
  case 'air':
   if(tryAir(f))break;
   airDrift(f);fastFall(f);ledgeCheck(f);break;
  case 'special_fall':
   airDrift(f,0.55);fastFall(f);ledgeCheck(f);break;
  case 'attack':stepAttack(f);break;
  case 'land':
   friction(f,f.lagLen>=10?0.6:1);if(f.sf>=f.lagLen){setState(f,'idle');groundMove(f);}break;
  case 'shield':
   if(!i.s){startLag(f,7);break;}
   if(pr(f,'j')||(f.tapJump&&f.flickT===0&&f.flickY<0)){startJumpsquat(f);break;}
   if(pr(f,'a')||pr(f,'z')){startMove(f,'grab');break;}
   if(f.flickT===0&&f.flickX){roll(f,f.flickX);break;}
   if(f.flickT===0&&f.flickY>0){setState(f,'spotdodge');break;}
   f.shield-=0.28;friction(f);if(f.shield<=0)shieldBreak(f);break;
  case 'shieldstun':
   friction(f,0.5);if(f.sf>=f.lagLen){if(i.s)setState(f,'shield');else setState(f,'idle');}break;
  case 'roll':{const n=f.sf;f.intan=n>=4&&n<=19;if(n>=4&&n<=24)f.vx=f.rollDir*5.2;else f.vx*=0.6;
   if(n>=32){f.face=-f.rollDir;setState(f,'idle');}break;}
  case 'spotdodge':f.intan=f.sf>=2&&f.sf<=16;friction(f);if(f.sf>=24)setState(f,'idle');break;
  case 'airdodge':
   f.intan=f.sf>=4&&f.sf<=25;f.noGrav=f.sf<28?1:0;f.vx*=0.9;f.vy*=0.9;if(f.sf>=30){setState(f,'special_fall');}break;
  case 'hitstun':
   f.hitstun--;if(!f.ground){if(f.hitstun<20&&f.tumble){/* allow slight drift late */}}
   else friction(f,0.6);
   if(f.hitstun<=0){if(f.ground)setState(f,'idle');else{setState(f,'air');f.tumbling=f.tumble;}}
   break;
  case 'tech':f.intan=f.sf<=20;if(f.rollDir){if(f.sf<=24)f.vx=f.rollDir*4;else f.vx*=0.6;}else friction(f);
   if(f.sf>=(f.rollDir?40:26)){setState(f,'idle');}break;
  case 'lying':
   friction(f);
   if(f.sf>8){if(Math.abs(i.x)>0.6){setState(f,'getup');f.rollDir=sgn(i.x);}
    else if(i.y<-0.6||pr(f,'a')||pr(f,'j')||pr(f,'b')||f.sf>60){setState(f,'getup');f.rollDir=0;}}
   break;
  case 'getup':f.intan=f.sf<=22;if(f.rollDir){if(f.sf<=26)f.vx=f.rollDir*3.4;else f.vx*=0.6;}else friction(f);
   if(f.sf>=(f.rollDir?36:30))setState(f,'idle');break;
  case 'ledge':stepLedge(f);break;
  case 'ledgeclimb':{f.intan=true;const L=f.ledge;if(f.sf>=24){f.x=L.x+L.side*(f.w/2+2);f.y=L.y;f.ground=STG.main;f.ledge=null;setState(f,'idle');}break;}
  case 'grab':stepGrab(f);break;
  case 'held':{const h=f.holder;if(!h||h.held!==f||(h.state!=='grab'&&h.state!=='throw')){f.holder=null;setState(f,f.ground?'idle':'air');}
   else{if(pr(f,'a')||pr(f,'b')||pr(f,'j')||(f.flickT===0))h.grabT-=4;}break;}
  case 'throw':stepThrow(f);break;
  case 'shieldbreak':f.noGrav=0;break;
  case 'dizzy':friction(f);if(pr(f,'a')||pr(f,'b')||pr(f,'j')||f.flickT===0)f.sf+=5;if(f.sf>=f.dizzyLen)setState(f,'idle');break;
  case 'bubbled':
   f.noGrav=1;f.vy=-0.35;f.vx*=0.9;f.bubbleT--;if(pr(f,'a')||pr(f,'b')||pr(f,'j')||f.flickT===0)f.bubbleT-=4;
   if(f.bubbleT<=0){setState(f,'air');snd('pop',.5);fxPush({k:'ring',x:f.x,y:f.y-f.h/2,t:0,len:12,s:f.h*0.9,col:'#ffffff'});}break;
  case 'respawn':
   f.noGrav=1;f.vx=0;f.vy=0;f.inv=Math.max(f.inv,120);
   if((f.sf>30&&(Math.abs(i.x)>0.3||Math.abs(i.y)>0.3||i.a||i.b||i.j||i.s))||f.sf>300){setState(f,'air');f.inv=120;}
   break;
 }
 physics(f);
}

function stepAttack(f){
 const m=f.move;if(!m){endMove(f);return;}
 if(m.charge&&f.mf===m.charge&&f.inp.a&&f.chargeT<60){f.chargeT++;if(f.chargeT%8===0)f.flash=3;}
 else{f.mf++;if(m.charge&&f.mf===m.charge+1)snd('swing',.35);}
 f.armor=m.armor===1||(Array.isArray(m.armor)&&f.mf>=m.armor[0]&&f.mf<=m.armor[1]);
 if(m.intan)f.intan=f.mf>=m.intan[0]&&f.mf<=m.intan[1];
 if(m.update)m.update(f,f.mf);
 if(f.move!==m)return;
 if(!f.ground){if(!m.noDrift)airDrift(f);if(m.air)fastFall(f);}
 else if(!m.keepVel)friction(f);
 if(!f.ground&&m.ledgeFrom&&f.mf>=m.ledgeFrom&&ledgeCheck(f))return;
 if(!m.loop&&f.mf>=m.len)endMove(f);
}

/* ---------------- ledge ---------------- */
function ledgeTaken(L,f){return fighters.some(o=>o!==f&&!o.out&&(o.state==='ledge'||o.state==='ledgeclimb')&&o.ledge===L);}
function ledgeCheck(f){
 if(f.ground||f.ledgeCD>0||f.inp.y>0.6)return false;
 const rec=f.state==='attack'&&f.move&&f.move.ledgeFrom;
 if(f.vy<-1&&!rec)return false;
 for(const L of LEDGES){if(ledgeTaken(L,f))continue;
  const dx=(L.x-f.x)*L.side;
  if(dx>-6&&dx<f.w/2+38&&f.y>L.y-14&&f.y-f.h<L.y+70){grabLedge(f,L);return true;}}
 return false;
}
function grabLedge(f,L){
 setState(f,'ledge');f.ledge=L;f.face=L.side;f.move=null;f.armor=false;f.x=L.x-L.side*(f.w*0.42);f.y=L.y+f.h*0.82;
 f.vx=f.vy=f.kvx=f.kvy=0;f.ff=false;f.jumps=f.c.njumps;f.upB=false;f.sideB=false;f.tumbling=false;
 if(!f.ledgeInvUsed){f.inv=Math.max(f.inv,32);f.ledgeInvUsed=true;}
 snd('grabl',.3);
}
function stepLedge(f){
 const L=f.ledge,i=f.inp;f.vx=f.vy=0;
 if(f.sf<8)return;
 const toward=i.x*L.side;
 if(pr(f,'j')){f.ledge=null;f.x=L.x-L.side*(f.w/2+1);f.y=L.y-2;f.vy=-f.c.jump*0.95;f.vx=L.side*1.8;f.inv=Math.max(f.inv,8);setState(f,'air');snd('jump',.25);return;}
 if(pr(f,'a')||pr(f,'b')){f.x=L.x+L.side*(f.w/2+2);f.y=L.y;f.ground=STG.main;f.ledge=null;f.face=L.side;startMove(f,'ledgeatk');return;}
 if(pr(f,'s')){f.x=L.x+L.side*(f.w/2+2);f.y=L.y;f.ground=STG.main;f.ledge=null;roll(f,L.side);return;}
 if(toward>0.6||i.y<-0.6){setState(f,'ledgeclimb');return;}
 if(i.y>0.6||toward<-0.6||f.sf>300){ledgeDrop(f);return;}
}
function ledgeDrop(f){const L=f.ledge;f.ledge=null;f.x=L.x-L.side*(f.w/2+3);f.ledgeCD=40;setState(f,'air');f.vy=0;}

/* ---------------- grab / throw ---------------- */
function startHold(att,t){
 if(t.state==='ledge')return;
 setState(att,'grab');att.held=t;att.move=null;att.grabT=Math.min(260,70+t.pct*0.9);att.vx=0;
 setState(t,'held');t.holder=att;t.move=null;t.armor=false;t.vx=t.vy=t.kvx=t.kvy=0;t.face=-att.face;t.tumbling=false;
 snd('grabl',.5);
}
function placeHeld(att){const t=att.held;if(!t)return;t.x=att.x+att.face*(att.w/2+t.w/2-6);t.y=att.y;t.ground=att.ground;}
function stepGrab(f){
 const t=f.held;friction(f);
 if(!t||t.holder!==f||t.state!=='held'){f.held=null;setState(f,'idle');return;}
 placeHeld(f);f.grabT--;
 if(f.grabT<=0){grabRelease(f);return;}
 if(f.sf<8)return;
 const i=f.inp;
 if(pr(f,'a')&&f.pumT<=0){t.pct=Math.min(999,t.pct+f.c.pummel);f.pumT=18;t.hud=8;t.flash=4;f.dmgDone+=f.c.pummel;f.hitlag=3;t.hitlag=3;snd('hit',.2);
  fxPush({k:'spark',x:t.x,y:t.y-t.h/2,t:0,len:8,s:12});return;}
 let k=null;
 if(Math.abs(i.x)>0.6&&Math.abs(i.x)>=Math.abs(i.y))k=sgn(i.x)===f.face?'f':'b';
 else if(Math.abs(i.y)>0.6)k=i.y<0?'u':'d';
 if(k){setState(f,'throw');f.throwK=k;}
}

/* ---------------- hits ---------------- */
function launch(t,d,ang,bkb,kbg,dir,att,isThrow){
 t.pct=Math.min(999,t.pct+d);t.hud=10;
 const p=t.pct,w=t.c.weight;
 let kb=((((p/10)+(p*d)/20)*(200/(w+100))*1.4+18)*kbg/100)+bkb;
 if(ang===361)ang=(t.ground&&kb<32)?0:44;
 if(t.armor&&!isThrow&&kb<130){t.flash=6;return 'armor';}
 let rad=ang*Math.PI/180,lx=Math.cos(rad)*dir,ly=-Math.sin(rad);
 if(!isThrow&&(Math.abs(t.inp.x)>0.3||Math.abs(t.inp.y)>0.3)){
  const px=-ly,py=lx,dot=t.inp.x*px+t.inp.y*py;lx+=px*dot*0.32;ly+=py*dot*0.32;const m=Math.hypot(lx,ly);lx/=m;ly/=m;}
 const v=kb*0.11;
 // release any holds
 if(t.held){const h=t.held;h.holder=null;t.held=null;setState(h,h.ground?'idle':'air');}
 if(t.holder){const h=t.holder;h.held=null;t.holder=null;if(h.state==='grab'||h.state==='throw')setState(h,'idle');}
 if(t.state==='ledge'||t.state==='ledgeclimb')t.ledge=null;
 t.kvx=lx*v;t.kvy=ly*v;t.vx=0;t.vy=0;t.ff=false;
 t.hitstun=Math.floor(kb*0.4);t.tumble=kb>80;t.tumbling=false;
 if(t.ground){if(t.kvy<-0.3)t.ground=null;else if(t.kvy>0&&kb>40){t.kvy=-t.kvy*0.8;t.ground=null;}else t.kvy=0;}
 t.move=null;t.armor=false;setState(t,'hitstun');t.upB=false;t.sideB=false;
 if(att&&att!==t){t.lastHit=att;t.lastHitF=frame;}
 if(kb>110)shake(Math.min(14,kb/14));
 return kb;
}
function hitTarget(att,t,hb,hx,hy,mul,proj){

 if(t.state==='shield'||t.state==='shieldstun'){shieldHit(att,t,d,hx,proj);return;}
 const dir=proj?sgn(proj.vx)||1:hb.dir==='rev'?-att.face:hb.dir==='away'?(sgn(t.x-att.x)||att.face):att.face;
 const wasBubble=t.state==='bubbled';
 const r=launch(t,d,hb.a,hb.b,hb.g,dir,att,false);
 att.dmgDone+=d;
 const hl=Math.floor(d/3)+3+(wasBubble?6:0);t.hitlag=hl;if(!proj){att.hitlag=hl;}
 if(wasBubble){snd('pop',.8);fxPush({k:'ring',x:t.x,y:t.y-t.h/2,t:0,len:14,s:t.h,col:'#ffffff'});}
 fxPush({k:'spark',x:hx,y:hy,t:0,len:10+d*0.4,s:10+d*1.6,col:r==='armor'?'#b6ff3c':null});
 snd('hit',Math.min(1,0.2+d/18));
 if(!proj&&att.move&&att.move.onHit)att.move.onHit(att,t);
}
function shieldHit(att,t,d,hx,proj){
 t.shield-=d;const dir=proj?sgn(proj.vx)||1:(sgn(t.x-att.x)||att.face);
 t.vx=dir*(0.18*d+1.2);setState(t,'shieldstun');t.lagLen=Math.floor(d*0.45)+3;
 const hl=Math.floor(d/3)+2;t.hitlag=hl;if(!proj){att.hitlag=hl;if(att.ground)att.vx=-dir*0.9;}
 snd('shield',.5);fxPush({k:'ring',x:hx,y:t.y-t.h/2,t:0,len:10,s:18,col:PCOL[t.slot]});

}
function shieldBreak(f){
 f.shield=30;setState(f,'shieldbreak');f.ground=null;f.vy=-10;f.vx=0;f.dizzyLen=clamp(400-f.pct*2,120,400);

function hurt(t){return{x1:t.x-t.w/2,x2:t.x+t.w/2,y1:t.y-t.h,y2:t.y};}
function circRect(cx,cy,r,b){const nx=clamp(cx,b.x1,b.x2),ny=clamp(cy,b.y1,b.y2);return (cx-nx)**2+(cy-ny)**2<=r*r;}
function canBeHit(t){return !t.out&&t.inv<=0&&!t.intan&&t.state!=='respawn'&&t.state!=='ledgeclimb';}
function processHits(){
 for(const f of fighters){
  if(f.out||f.hitlag>0||f.state!=='attack'||!f.move)continue;
  const m=f.move,mul=m.charge?1+0.4*f.chargeT/60:1;
  if(m.gb){const g=m.gb;if(f.mf>=g.s&&f.mf<=g.e){const hx=f.x+f.face*g.x,hy=f.y-f.h/2+g.y;
    for(const t of fighters){if(t===f||!canBeHit(t)||t.state==='held'||t.state==='lying'||t.state==='bubbled')continue;
     if(!t.ground&&t.y<(f.ground?f.ground.y:f.y)-30)continue;
     if(circRect(hx,hy,g.r,hurt(t))){startHold(f,t);placeHeld(f);break;}}}}
  if(!m.hb)continue;
  for(const hb of m.hb){
   if(f.mf<hb.s||f.mf>hb.e)continue;
   const sc=hb.fuel?0.55+0.45*f.fuel/100:1;
   const hx=f.x+f.face*hb.x*sc,hy=f.y-f.h/2+hb.y,hr=hb.r*sc;
   for(const t of fighters){
    if(t===f||!canBeHit(t))continue;
    const key=t.slot*10+(hb.grp||0),last=f.hitSet.get(key);
    if(last!==undefined&&(!hb.rehit||frame-last<hb.rehit))continue;
    const sh=t.state==='shield'||t.state==='shieldstun';
    const hit=sh?((hx-t.x)**2+(hy-(t.y-t.h/2))**2<=(hr+shieldR(t))**2):circRect(hx,hy,hr,hurt(t));
    if(!hit)continue;
    f.hitSet.set(key,frame);
    hitTarget(f,t,hb,(hx+t.x)/2,(hy+t.y-t.h/2)/2,mul,null);
    if(f.move!==m)break;
   }
   if(f.move!==m)break;
  }
 }
}
function shieldR(f){return (Math.max(f.w,f.h)*0.55+6)*(0.45+0.55*f.shield/60);}

/* ---------------- physics ---------------- */
function canFallOff(f){return ['idle','walk','dash','run','crouch','hitstun','land','tech','getup','roll','lying','dizzy','shieldstun'].includes(f.state)&&f.state!=='land'||(f.state==='attack'&&f.move&&f.move.offEdge);}
function physics(f){
 if(['ledge','held','respawn','ledgeclimb'].includes(f.state))return;
 if(f.kvx||f.kvy){const m=Math.hypot(f.kvx,f.kvy),nm=Math.max(0,m-0.188);if(nm===0){f.kvx=f.kvy=0;}else{f.kvx*=nm/m;f.kvy*=nm/m;}}
 const px=f.x,py=f.y;
 if(f.ground){
  f.kvy=0;f.x+=f.vx+f.kvx;f.y=f.ground.y;
  if(f.kvx){const t=f.c.traction;if(Math.abs(f.kvx)<=t)f.kvx=0;else f.kvx-=sgn(f.kvx)*t;}
  const g=f.ground;
  if(f.x<g.x1||f.x>g.x2){
   if(canFallOff(f)||g.soft&&!['land','shield','attack'].includes(f.state)){f.ground=null;
    if(['idle','walk','dash','run','crouch','tech','getup','roll','lying','dizzy','shieldstun'].includes(f.state)){setState(f,'air');}}
   else{f.x=clamp(f.x,g.x1,g.x2);f.vx=0;f.kvx=0;}
  }
 }else{
  if(!f.noGrav){const cap=f.ff?f.c.ffall:f.c.maxFall;if(f.state==='bubbled'){}else{f.vy=Math.min(cap,f.vy+f.c.grav);if(f.ff)f.vy=f.c.ffall;}}
  f.x+=f.vx+f.kvx;f.y+=f.vy+f.kvy;
  if(f.vy+f.kvy>=0&&f.state!=='bubbled'){
   for(const s of SURF){
    if(s.soft&&(f.dropT>0||(f.inp.y>0.6&&['air','special_fall'].includes(f.state)&&f.ff)))continue;
    if(py<=s.y+0.5&&f.y>=s.y&&f.x>=s.x1&&f.x<=s.x2){f.y=s.y;land(f,s);break;}
   }
  }
  // solid stage body
  for(const r of STG.body){
   const b=hurt(f);if(b.x2<=r[0]||b.x1>=r[2]||b.y2<=r[1]||b.y1>=r[3])continue;
   if(f.ground)continue;
   const penL=b.x2-r[0],penR=r[2]-b.x1,penB=r[3]-b.y1,penT=b.y2-r[1];
   let mn=Math.min(penL,penR,penB,r[1]===STG.main.y?penT+999:penT);
   if(mn===penB&&Math.min(penL,penR)<f.w*0.6)mn=Math.min(penL,penR); // slide around the lip instead of bonking
   if(mn===penL){f.x-=penL;if(f.kvx>0)f.kvx=-f.kvx*0.5;if(f.vx>0)f.vx=0;}
   else if(mn===penR){f.x+=penR;if(f.kvx<0)f.kvx=-f.kvx*0.5;if(f.vx<0)f.vx=0;}
   else if(mn===penB){f.y+=penB;if(f.kvy<0)f.kvy=-f.kvy*0.4;if(f.vy<0)f.vy=0;}
   else{f.y-=penT;}
  }
 }
}
function land(f,s){
 f.ground=s;f.ledgeInvUsed=false;
 const st=f.state,fall=f.vy+f.kvy;
 f.vy=0;f.kvy=0;f.ff=false;f.jumps=f.c.njumps;f.upB=false;f.sideB=false;
 if(st==='attack'){const m=f.move;
  if(m&&m.onLand){m.onLand(f);return;}
  if(m&&m.air){let ll=m.ll||10;if(f.lcT<=7){ll=Math.ceil(ll/2);f.lc=10;}startLag(f,ll);return;}
  return;}
 if(st==='airdodge'||st==='special_fall'){startLag(f,10);return;}

  if(f.sT<=20){setState(f,'tech');f.rollDir=Math.abs(f.inp.x)>0.5?sgn(f.inp.x):0;f.kvx=0;f.vx=0;f.hitstun=0;f.tumbling=false;snd('tech',.4);fxPush({k:'ring',x:f.x,y:f.y-f.h/2,t:0,len:10,s:30,col:'#ffffff'});return;}
  if(f.tumble||f.tumbling){setState(f,'lying');f.kvx*=0.3;f.tumbling=false;f.hitstun=0;dust(f.x,f.y,8);snd('thud',.4);return;}
  return;}

function stepProjectiles(){
 for(let k=projectiles.length-1;k>=0;k--){const p=projectiles[k];p.t++;
  if(p.k==='bubble'){p.x+=p.vx;p.vx*=0.995;p.y+=Math.sin(p.t*0.15)*0.6;
   let gone=p.t>=p.len||p.owner.out;
   for(const t of fighters){if(gone)break;if(t===p.owner||!canBeHit(t)||t.state==='held'||t.state==='bubbled')continue;
    const sh=t.state==='shield'||t.state==='shieldstun';
    if(sh){if((p.x-t.x)**2+(p.y-(t.y-t.h/2))**2<=(p.r+shieldR(t))**2){shieldHit(p.owner,t,4,p.x,p);gone=true;snd('pop',.4);}continue;}
    if(circRect(p.x,p.y,p.r,hurt(t))){
     t.pct=Math.min(999,t.pct+3);t.hud=8;p.owner.dmgDone+=3;
     if(t.holder){const h=t.holder;h.held=null;t.holder=null;setState(h,'idle');}
     if(t.held){const h=t.held;h.holder=null;t.held=null;setState(h,'idle');}
     if(t.state==='ledge')t.ledge=null;
     t.move=null;t.armor=false;setState(t,'bubbled');t.ground=null;t.bubbleT=Math.min(140,40+t.pct*0.6);t.vx=p.vx*0.3;t.vy=0;t.kvx=t.kvy=0;t.ff=false;
     t.lastHit=p.owner;t.lastHitF=frame;snd('pop',.7);gone=true;}
   }
   if(gone){projectiles.splice(k,1);fxPush({k:'ring',x:p.x,y:p.y,t:0,len:10,s:p.r*1.4,col:'#ffffff'});}
  }
 }
 for(let k=puddles.length-1;k>=0;k--){const q=puddles[k];q.t++;
  if(q.t%20===0)for(const t of fighters){if(t===q.owner||!canBeHit(t))continue;

    fxPush({k:'gas',x:t.x,y:t.y-8,vx:0,vy:-1,t:0,len:20,s:10});}}

/* ---------------- match flow ---------------- */
function startMatch(opts){
 opts=opts||{};
 loadStage(setup.stage);
 const rules=opts.rules||{stocks:(setup.rules==='time')?0:setup.stocks,time:(setup.rules==='stock')?0:setup.minutes*3600};
 G={rules,attract:!!opts.attract,training:!!opts.training,countdown:opts.attract?0:180,timer:rules.time,endT:0,sd:!!opts.sd,paused:false};
 fighters=[];projectiles=[];puddles=[];FX=[];
 const slots=opts.slots||setup.slots;
 let n=0;
 slots.forEach((s,k)=>{if(s.type==='off')return;const f=makeFighter(k,s,rules);if(opts.pct)f.pct=opts.pct;fighters.push(f);n++;});
 cam.x=0;cam.y=-80;cam.z=Math.min(SW/1000,SH/620);
 if(!G.attract)snd('go',0);
}
function stepGame(){
 if(!G||G.paused)return;
 frame++;
 if(G.countdown>0){G.countdown--;if(G.countdown%60===0&&G.countdown>0)snd('beep',.5);if(G.countdown===0)snd('go',.7);}
 for(const f of fighters){
  if(f.hitlag===0)f.prev=f.inp;
  if(G.countdown>0||G.endT>0)f.inp=blank();
  else f.inp=f.cpu?cpuInput(f):humanInput(f);
 }
 for(const f of fighters)stepFighter(f);
 for(const f of fighters)if(f.state==='grab'||f.state==='throw')placeHeld(f);
 processHits();
 stepProjectiles();
 for(const f of fighters)checkBlast(f);
 if(G.training){for(const f of fighters)if(f.out){f.out=false;}}
 stepFX();
 // timer / end
 if(G.countdown===0&&G.endT===0&&!G.attract&&!G.training){
  if(G.rules.time){G.timer--;if(G.timer<=0){G.timer=0;endMatch();}}
  if(G.rules.stocks&&fighters.filter(f=>!f.out).length<=1)endMatch();
 }
 if(G.attract){const alive=fighters.filter(f=>!f.out);if(alive.length<=1){fighters.forEach(f=>{f.out=false;f.stocks=Infinity;if(f.state!=='respawn')ko(f);});}}
 if(G.endT>0){G.endT++;if(G.endT===120)showResults();}
}
function endMatch(){G.endT=1;snd('game',1);shake(6);}
function ranking(){
 const r=G.rules;const arr=fighters.slice();
 arr.sort((a,b)=>{
  if(r.stocks&&!r.time){return (a.out?a.place:0)-(b.out?b.place:0)||(a.pct-b.pct);}
  if(r.stocks&&r.time){const sa=a.out?-1:a.stocks,sb=b.out?-1:b.stocks;return sb-sa||(a.out&&b.out?a.place-b.place:0)||a.pct-b.pct;}
  return b.score-a.score;});
 // ties for first
 const top=arr[0];const tied=arr.filter(f=>r.time&&(r.stocks?(!f.out&&f.stocks===top.stocks&&!top.out):f.score===top.score));
 return{arr,tied:tied.length>1?tied:null};
}

 bind('[data-ch]',el=>{const k=+el.dataset.ch;const s=setup.slots[k];const i=PLAYABLE.indexOf(s.char);s.char=PLAYABLE[(i+1)%PLAYABLE.length];if(s.type==='off'&&k>0)s.type='cpu';saveSetup();versusScreen();});
 bind('[data-type]',el=>{const k=+el.dataset.type;if(k===0)return;const s=setup.slots[k];s.type=s.type==='off'?'cpu':'off';saveSetup();versusScreen();});
 bind('[data-lv]',el=>{const k=+el.dataset.lv;const s=setup.slots[k];s.lvl=clamp(s.lvl+(+el.dataset.d),1,9);saveSetup();versusScreen();});
 bind('[data-rule]',el=>{setup.rules=el.dataset.rule;saveSetup();versusScreen();});
 bind('[data-st]',el=>{setup.stocks=clamp(setup.stocks+(+el.dataset.st),1,9);saveSetup();versusScreen();});
 bind('[data-mn]',el=>{setup.minutes=clamp(setup.minutes+(+el.dataset.mn),1,10);saveSetup();versusScreen();});
 bind('#bk',titleScreen);
 bind('#go',()=>{const on=setup.slots.filter(s=>s.type!=='off').length;if(on<2){setup.slots[1].type='cpu';}
  const r=setup.rules;startMatch({rules:{stocks:r==='time'?0:setup.stocks,time:r==='stock'?0:setup.minutes*3600},slots:setup.slots.map(s=>({...s,type:s.type}))});G.lastSlots=setup.slots.map(s=>({...s}));G.lastRules={...G.rules};hideMenu();clearTouch();});
}
let trainCfg={you:'mochi',foe:'gorbo',beh:'stand'};
function trainingScreen(){
 showMenu(`<h2>TRAINING</h2>
 <div class="card"><div class="opt">You<div class="seg">${PLAYABLE.map(c=>`<b data-you="${c}" class="${trainCfg.you===c?'on':''}">${CHARS[c].name.toUpperCase()}</b>`).join('')}</div></div>
 <div class="opt">Dummy<div class="seg">${PLAYABLE.map(c=>`<b data-foe="${c}" class="${trainCfg.foe===c?'on':''}">${CHARS[c].name.toUpperCase()}</b>`).join('')}</div></div>
 <div class="opt">Dummy does<div class="seg">${[['stand','STAND'],['shield','SHIELD'],['jump','JUMP'],['cpu','FIGHT']].map(([k,l])=>`<b data-beh="${k}" class="${trainCfg.beh===k?'on':''}">${l}</b>`).join('')}</div></div></div>
 <div class="card note" style="text-align:left;max-width:680px">
 <b>Controls.</b> Left thumb: stick (appears where you touch). Flick the stick and tap <b>A</b> for a smash attack; hold <b>A</b> to charge it. Tilt gently and tap <b>A</b> for a tilt. <b>B</b> + direction for specials. Flick up to jump (tap jump) or use <b>JUMP</b>. <b>SHIELD</b> on the ground blocks; with a flick it rolls or spot-dodges; in the air it air-dodges. Press <b>SHIELD</b> just before an aerial lands to L-cancel. Press it as you hit the ground after being launched to tech. Keyboard: arrows/WASD, J attack, K special, Space jump, L shield, U grab, Shift for tilts. Controllers work too, with the right stick as smash/aerial stick.</div>
 <div class="row"><button class="btn alt sm" id="bk">BACK</button><button class="btn" id="go">START</button></div>`,true);
 bind('[data-you]',el=>{trainCfg.you=el.dataset.you;trainingScreen();});bind('[data-foe]',el=>{trainCfg.foe=el.dataset.foe;trainingScreen();});bind('[data-beh]',el=>{trainCfg.beh=el.dataset.beh;trainingScreen();});
 bind('#bk',titleScreen);bind('#go',startTraining);
}
function startTraining(){
 startMatch({training:true,rules:{stocks:0,time:0},slots:[{type:'human',char:trainCfg.you},{type:'cpu',char:trainCfg.foe,lvl:5,dummy:trainCfg.beh!=='cpu'},{type:'off'},{type:'off'}]});
 const d=fighters[1];d.dummyBeh=trainCfg.beh;hideMenu();clearTouch();
}
const _cpuInput=cpuInput;
cpuInput=function(f){if(f.dummy){const i=blank();if(G&&G.countdown===0){if(f.dummyBeh==='shield'&&f.ground)i.s=1;if(f.dummyBeh==='jump'&&f.ground&&f.state==='idle'&&f.sf>30&&!f.prev.j)i.j=1;
  if(!f.ground&&(f.x<STG.main.x1||f.x>STG.main.x2||f.y>4)){const o=blank();return cpuRecover(f,o,k=>{if(!f.prev[k])o[k]=1;});}}return i;}return _cpuInput(f);};
function settingsScreen(){
 showMenu(`<h2>SETTINGS</h2><div class="card">
 <div class="opt">Tap jump (flick up to jump)<div class="seg"><b data-tj="1" class="${setup.tapJump?'on':''}">ON</b><b data-tj="0" class="${!setup.tapJump?'on':''}">OFF</b></div></div>
 <div class="opt">Sound<div class="seg"><b data-sd="1" class="${setup.sound?'on':''}">ON</b><b data-sd="0" class="${!setup.sound?'on':''}">OFF</b></div></div></div>
 <button class="btn" id="bk">DONE</button>`,true);
 bind('[data-tj]',el=>{setup.tapJump=el.dataset.tj==='1';saveSetup();settingsScreen();});
 bind('[data-sd]',el=>{setup.sound=el.dataset.sd==='1';saveSetup();settingsScreen();});
 bind('#bk',titleScreen);
}
function togglePause(){
 if(!G||G.attract||G.endT>0)return;G.paused=!G.paused;clearTouch();
 if(G.paused){showMenu(`<h2>PAUSED</h2><button class="btn" id="rs">RESUME</button>${G.training?'<button class="btn alt" id="rt">RESET %</button>':''}<button class="btn alt" id="qt">QUIT</button>`,true);
  bind('#rs',togglePause);bind('#qt',()=>{G.paused=false;titleScreen();});
  bind('#rt',()=>{fighters.forEach(f=>{f.pct=0;});togglePause();});}
 else hideMenu();
}
function showResults(){
 const {arr,tied}=ranking();
 if(tied&&!G.sd){const slots=[0,1,2,3].map(k=>{const f=tied.find(t=>t.slot===k);return f?{...f.cfg}:{type:'off'};});const last=G.lastSlots,lr=G.lastRules;
  startMatch({sd:true,rules:{stocks:1,time:0},slots,pct:300});G.lastSlots=last;G.lastRules=lr;G.sdFrom=arr.map(f=>({slot:f.slot,kos:f.kos,falls:f.falls,dmg:f.dmgDone,id:f.id,cpu:f.cpu,lvl:f.lvl}));return;}
 G.paused=true;
 const w=arr[0];
 const rows=arr.map((f,k)=>`<div class="r" style="border-left:6px solid ${PCOL[f.slot]}"><div class="pl">${k+1}</div><canvas width="96" height="96" data-res="${f.slot}" style="position:static;width:44px;height:44px"></canvas>
  <div class="nmx">${f.cpu?'CPU '+f.lvl:'P'+(f.slot+1)} · ${f.c.name}</div><div class="st">KOs ${f.kos} · Falls ${f.falls}${f.sds?' (SD '+f.sds+')':''} · Dmg ${Math.round(f.dmgDone)}</div></div>`).join('');
 showMenu(`<h2>${w.cpu?'CPU '+w.lvl:'P'+(w.slot+1)} WINS!</h2><div class="note">${w.c.name} takes it${G.sd?' in sudden death':''}.</div><div class="res">${rows}</div>
  <div class="row"><button class="btn" id="again">REMATCH</button><button class="btn alt" id="ch">FIGHTERS</button><button class="btn alt sm" id="tt">TITLE</button></div>`,true);
 menu.querySelectorAll('canvas[data-res]').forEach(c=>{const f=arr.find(q=>q.slot===+c.dataset.res);drawPortraitSafe(c,f.id,f.slot);});
 const ls=G.lastSlots,lr=G.lastRules;
 bind('#again',()=>{startMatch({rules:lr||undefined,slots:ls||setup.slots});G.lastSlots=ls;G.lastRules=lr;hideMenu();clearTouch();});
 bind('#ch',versusScreen);bind('#tt',titleScreen);
}
// portrait drawing using the shared drawing functions on another canvas
function drawPortraitSafe(canvas,id,slot){
 const x=canvas.getContext('2d'),s=canvas.width;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,s,s);
 x.fillStyle=PCOL[slot]+'40';x.beginPath();x.arc(s/2,s/2,s/2-2,0,7);x.fill();
 const real=ctx;ctx=x;
 try{const k=s/64;x.translate(s/2,s*0.8);const sc=id==='gorbo'?0.7:1.25;x.scale(k*sc,k*sc);if(id==='gorbo')x.translate(-6,10);
  const fake={id,c:CHARS[id],state:'idle',sf:0,face:1,flash:0,mf:0,slot,fuel:100,move:null};
  if(id==='mochi')drawMochi(fake,null);else drawGorbo(fake,null);}finally{ctx=real;}
}

/* ---------------- boot ---------------- */
window.SKY={startMatch,stepGame,get G(){return G},get fighters(){return fighters},setup,MOVES,CHARS,
 sim(n){for(let k=0;k<n;k++){const cd=G.countdown;stepGame();if(cd>0&&G.countdown===0)G.goF=frame;if(G.paused)break;}},togglePause,showResults};
titleScreen();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{if(menu.querySelector('canvas'))menu.querySelectorAll('canvas[data-ch]').forEach(c=>drawPortraitSafe(c,setup.slots[+c.dataset.ch].char,+c.dataset.ch));});
requestAnimationFrame(loop);
</script>
