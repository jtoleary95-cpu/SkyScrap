<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2338">
<title>Sky Scrap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b2338;--panel:#24304d;--panel2:#2f3d61;--hi:#ffd166;--txt:#f4f1ea;--dim:#9aa6c4;--p1:#ff5a5f;--p2:#4ea8ff;--p3:#ffc93c;--p4:#4cd47a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);color:var(--txt);font-family:'Baloo 2','Arial Rounded MT Bold',system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;overscroll-behavior:none}
canvas{position:fixed;inset:0;display:block;touch-action:none}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
#menu.on{pointer-events:auto}
.scr{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 14px;height:100%;overflow:auto;width:100%}
.scr>.in{margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.bar{display:flex;align-items:center;justify-content:space-between;width:min(860px,100%);gap:10px}
.vs{display:grid;grid-template-columns:1.25fr 1fr;gap:10px;width:min(860px,100%);align-items:start}
.vs .card{width:100%}
@media (max-width:640px){.vs{grid-template-columns:1fr}}
.dim{background:rgba(15,20,35,.72)}
.logo{font-size:min(15vw,96px);line-height:.9;font-weight:800;letter-spacing:2px;color:#fff;text-shadow:0 5px 0 #c2403d,0 9px 0 #1b2338,0 0 30px rgba(255,209,102,.5);transform:rotate(-3deg);margin:4px 0 10px;text-align:center}
.logo small{display:block;font-size:.32em;color:var(--hi);text-shadow:0 3px 0 #1b2338;letter-spacing:6px}
.btn{pointer-events:auto;font:inherit;font-weight:800;font-size:22px;color:var(--ink);background:var(--hi);border:0;border-radius:16px;padding:8px 28px;min-width:220px;box-shadow:0 5px 0 #b8892a;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8892a}
.btn.alt{background:#e8ecf7;box-shadow:0 5px 0 #8f9bb9}
.btn.off{background:#4b5675;color:#8d97b3;box-shadow:0 5px 0 #323a52}
.btn.sm{font-size:17px;min-width:0;padding:5px 16px;border-radius:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{background:var(--panel);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 #141a2b;width:min(680px,100%)}
.card h3{margin:0 0 6px;font-size:16px;color:var(--dim);letter-spacing:2px}
.slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.slot{background:var(--panel2);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid transparent}
.slot.off{opacity:.45}
.slot .tag{font-weight:800;font-size:15px;border-radius:8px;padding:0 10px;color:#fff;width:100%;text-align:center;cursor:pointer}
.slot canvas{position:static;width:min(58px,11vh);height:min(58px,11vh);cursor:pointer}
.slot .nm{font-weight:800;font-size:16px;cursor:pointer;line-height:1.1}
.slot .lv{display:flex;gap:4px;align-items:center;font-size:14px;white-space:nowrap}
.slot .lv b{background:#46557f;border-radius:8px;width:26px;text-align:center;cursor:pointer}
.opt{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;font-size:16px;font-weight:600;flex-wrap:wrap}
.seg{display:flex;gap:4px}
.seg b{background:#46557f;border-radius:10px;padding:2px 12px;cursor:pointer;font-weight:800}
.seg b.on{background:var(--hi);color:var(--ink)}
.stg{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.stg .secret{background:#120d22;color:#b388ff}
.stg div{background:var(--panel2);border-radius:12px;padding:2px 8px;font-weight:800;font-size:15px;line-height:1.15;border:3px solid transparent;cursor:pointer}
.stg div.on{border-color:var(--hi)}
.stg div.lock{opacity:.4;cursor:default}
.stg small{display:block;font-weight:600;color:var(--dim);font-size:11px}
.res{width:min(680px,100%);display:flex;flex-direction:column;gap:6px}
.res .r{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:14px;padding:6px 12px;font-size:17px}
.res .pl{font-size:26px;font-weight:800;width:44px}
.res .nmx{flex:1;font-weight:800}
.res .st{color:var(--dim);font-size:14px}
h2{margin:0;font-size:36px;color:var(--hi);text-shadow:0 3px 0 #1b2338}
#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--ink);font-size:24px;font-weight:800;text-align:center;padding:20px;z-index:9}
@media (orientation:portrait) and (max-width:900px){#rot{display:flex}}
.ph{font-size:60px;animation:tilt 1.6s ease-in-out infinite}
@keyframes tilt{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
.note{color:var(--dim);font-size:14px;text-align:center;max-width:560px}
.cdot{width:22px;height:22px;border-radius:50%;border:3px solid #fff;cursor:pointer;box-shadow:0 2px 0 #141a2b;flex:none}
.srow{display:flex;gap:4px 6px;align-items:center;justify-content:center;min-height:24px;flex-wrap:wrap}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(780px,100%)}
.ctile{background:var(--panel2);border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid transparent;cursor:pointer}
.ctile.on{border-color:var(--hi)}
.ctile canvas{position:static;width:min(64px,12vh);height:min(64px,12vh)}
.ctile b{font-size:17px}.ctile small{color:var(--dim);font-size:11px;text-align:center;line-height:1.15}
.seg{flex-wrap:wrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="menu"></div>
<div id="rot"><div class="ph">📱</div>Turn your phone sideways<div class="note">Sky Scrap plays in landscape.</div></div>
<script>
'use strict';
/* =========================================================
   SKY SCRAP  —  an original platform fighter
   ========================================================= */
const cv=document.getElementById('c');let ctx=cv.getContext('2d');
let SW=0,SH=0,DPR=1;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);SW=innerWidth;SH=innerHeight;cv.width=Math.round(SW*DPR);cv.height=Math.round(SH*DPR);cv.style.width=SW+'px';cv.style.height=SH+'px';}
addEventListener('resize',resize);resize();

const PCOL=['#ff5a5f','#4ea8ff','#ffc93c','#4cd47a'];
const PALETTE=['#ff5a5f','#4ea8ff','#ffc93c','#4cd47a','#a77bff','#ff9f43','#ff7ac8','#f2f2f2'];
function mixc(a,b,t){const p=parseInt(a.slice(1),16),q=parseInt(b.slice(1),16);const ch=(sh)=>Math.round(((p>>sh)&255)*(1-t)+((q>>sh)&255)*t);return '#'+((1<<24)|(ch(16)<<16)|(ch(8)<<8)|ch(0)).toString(16).slice(1);}
// give every active slot a distinct color, keeping choices where possible
function fixColors(slots){const used=new Set();slots.forEach((q,k)=>{if(!q||q.type==='off')return;let c=(q.col===undefined||q.col===null)?k:q.col;
 for(let n=0;n<8&&used.has(c);n++)c=(c+1)%8;q.col=c;used.add(c);});return slots;}
function nextFreeCol(slots,k){const used=new Set(slots.map((q,j)=>j!==k&&q&&q.type!=='off'?q.col:null));let c=slots[k].col;for(let n=0;n<8;n++){c=(c+1)%8;if(!used.has(c))return c;}return slots[k].col;}
const TPS=66; // a touch faster than 60 for a Melee-speed feel
const rand=Math.random,sgn=v=>v>0?1:v<0?-1:0,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;

/* ---------------- settings & setup ---------------- */
const SAVEKEY='skyscrap_v1';
const setup={items:'med',rules:'stock',stocks:4,minutes:4,stage:'temple',tapJump:true,sound:true,music:true,
  slots:[{type:'human',char:'mochi',lvl:5},{type:'cpu',char:'hippo',lvl:5},{type:'off',char:'calypso',lvl:5},{type:'off',char:'giraffe',lvl:5}]};
try{const s=JSON.parse(localStorage.getItem(SAVEKEY)||'null');if(s)Object.assign(setup,s);}catch(e){}
function saveSetup(){try{localStorage.setItem(SAVEKEY,JSON.stringify(setup));}catch(e){}}

/* ---------------- stage ---------------- */
// moving platforms (Storm Front)
var MOV={list:[],waveT:0,dir:'east',spawnT:0,n:0,flash:0};
function mkMover(cx,cy,w,vx,vy){return{x1:cx-w/2,x2:cx+w/2,y:cy,vx,vy,soft:true,moving:true,id:++MOV.n,seed:rand()*10};}
function mkFloe(cx,cy,w,vx){const m=mkMover(cx,cy,w,vx,0);m.ice=1;m.occ=0;m.baseY=cy;m.ph=rand()*6;return m;}
function resetMovers(){MOV.list=[];MOV.waveT=0;MOV.dir='east';MOV.spawnT=60;MOV.flash=0;MOV.respawnQ=[];
 if(!STG||!STG.movers)return;
 if(STG.movers==='jeep'){MOV.spawnT=90;return;}
 if(STG.movers==='ice'){for(const [x,y,w,vx] of [[-240,0,160,0.3],[-80,6,140,-0.25],[80,0,140,0.25],[240,4,160,-0.3],[-160,-120,130,0.35],[160,-130,130,-0.35],[0,-230,130,0.3]])MOV.list.push(mkFloe(x*WS,y*YS,w*WS,vx*1.6));return;}
 for(const [x,y,w] of [[-300,-40,150],[260,-120,140],[-560,-200,150],[60,-250,130],[520,-30,140]])MOV.list.push(mkMover(x*WS,y*YS,w*WS,1.1,0));}
function spawnMover(){const d=MOV.dir,w=125+rand()*55;
 const W2=w*WS/1.2;if(d==='east')MOV.list.push(mkMover(-940*BX,(-290+rand()*330)*YS,W2,1.6+rand()*0.8,0));
 else if(d==='west')MOV.list.push(mkMover(940*BX,(-290+rand()*330)*YS,W2,-(1.6+rand()*0.8),0));
 else if(d==='rise'){let x=(rand()<0.5?-1:1)*(150+rand()*420)*WS;MOV.list.push(mkMover(x,470*YS,W2,0,-(1.6+rand()*0.8)));}
 else{let x=(rand()<0.5?-1:1)*(150+rand()*420)*WS;MOV.list.push(mkMover(x,-720*YS,W2,0,1.4+rand()*0.7));}}
function stepMovers(){
 if(!STG.movers)return;
 if(STG.movers==='ice')return stepIce();
 if(STG.movers==='jeep')return stepJeeps();
 MOV.waveT++;if(MOV.waveT>=360){MOV.waveT=0;const opts=['east','west','rise','sink'].filter(d=>d!==MOV.dir);MOV.dir=opts[Math.floor(rand()*opts.length)];MOV.spawnT=20;}
 if(--MOV.spawnT<=0){MOV.spawnT=85+rand()*45;spawnMover();}
 for(const m of MOV.list){m.x1+=m.vx;m.x2+=m.vx;m.y+=m.vy;if(m.x1>1050*BX||m.x2<-1050*BX||m.y<-800*YS||m.y>500*YS)m.dead=true;}
 MOV.list=MOV.list.filter(m=>!m.dead);
 if(MOV.flash>0)MOV.flash--;else if(rand()<0.003){MOV.flash=18;snd('thunder',.5);}
}
function stepIce(){
 for(const m of MOV.list){const cx=(m.x1+m.x2)/2;if((cx>560*WS&&m.vx>0)||(cx<-560*WS&&m.vx<0))m.vx=-m.vx;
  if(m.rise!==undefined){m.baseY=Math.max(m.rise,m.baseY-4);if(m.baseY<=m.rise)delete m.rise;}
  const oy=m.y;m.ph+=0.03;m.y=m.baseY+Math.sin(m.ph)*4;m.vy=m.y-oy;m.x1+=m.vx;m.x2+=m.vx;
  const rid=fighters.some(f=>!f.out&&f.ground===m);
  if(rid){m.occ++;if(m.occ===360){snd('crack',.5);}if(m.occ>=480){m.dead=true;snd('shatter',.8);
   for(let k=0;k<14;k++)fxPush({k:'ice',x:m.x1+rand()*(m.x2-m.x1),y:m.y+rand()*10,vx:(rand()-.5)*4,vy:-1-rand()*3,t:0,len:30,s:4+rand()*6});
   MOV.respawnQ.push(80);}}
  else m.occ=Math.max(0,m.occ-0.5);}
 MOV.list=MOV.list.filter(m=>!m.dead);
 MOV.respawnQ=MOV.respawnQ.map(t=>t-1);
 while(MOV.respawnQ.length&&MOV.respawnQ[0]<=0){MOV.respawnQ.shift();
  // a fresh sheet bobs up out of the water in an open spot
  let x=0;for(let tries=0;tries<12;tries++){x=(rand()-.5)*760*WS;if(!MOV.list.some(m=>Math.abs((m.x1+m.x2)/2-x)<150))break;}
  const by=(-200+rand()*210)*YS,m=mkFloe(x,STG.water+20,130+rand()*40,(rand()<0.5?-1:1)*(0.2+rand()*0.25));m.rise=by;MOV.list.push(m);splash(x,STG.water,10);snd('splash',.5);}
}
// ---- stage hazards: hurricane (island), crossing gate (train), breakable walls (void)
const HZ={phase:'calm',t:0,dir:1,next:0,x:0,hit:new Set(),walls:[]};
function resetHazards(){HZ.phase='calm';HZ.t=0;HZ.dir=1;HZ.next=STG.airlock?700+rand()*300:STG.hurricane?1500+rand()*600:STG.gantry?600+rand()*240:STG.stampede?500+rand()*300:0;HZ.x=0;HZ.hit=new Set();
 HZ.walls=(STG.walls||[]).map((w,k)=>w.fold?{x:w.x,top:w.top,broken:0,fold:w.fold,bot:w.top}:w.glass?{x:w.x,top:w.top,broken:0,glass:1,gp:k?'open':'closed',gt:0,gn:k?360:420,bot:k?w.top:0}:{x:w.x,top:w.top,broken:0});
 HZ.k=0;HZ.burn=null;HZ.toastT=0;HZ.lava=150*YS;HZ.lp='calm';HZ.lt=0;HZ.lnext=700+rand()*300;HZ.rocks=[];HZ.rnext=420+rand()*200;HZ.fw=null;HZ.fnext=300+rand()*120;HZ.cd=new Map();
 if(STG.kitchen)HZ.burn={i:-1,ph:'off',t:0,next:200};
 HZ.dg=STG.dragon?{ph:0,t:0,dir:1,x:0,next:900+rand()*300}:null;
 HZ.ofp='flat';HZ.oft=0;HZ.ofn=420+rand()*200;HZ.ofs=1;HZ.ofk='fold';HZ.ofc=0;
 HZ.leader=-1;HZ.tl=(STG.tiles||[]).slice(1).map(()=>({st:'shut',t:0,c:0}));for(const p of STG.plats)if(p.crumble){if(p.y0===undefined)p.y0=p.y;p.y=p.y0;p.st='ok';p.ct=0;p.cc=0;}
 HZ.jp='away';HZ.jt=0;HZ.jn=420+rand()*240;HZ.las=[];HZ.sh=null;HZ.shn=600+rand()*300;
 HZ.belt=1;HZ.bt=0;HZ.toys=[];HZ.toyN=0;HZ.tnext=240;HZ.vp='open';HZ.vt=0;HZ.vn=420;
 HZ.flood=96*YS;HZ.fp='calm';HZ.ft=0;HZ.fnext=700+rand()*300;HZ.mist={i:1,ph:'off',t:0,next:200};HZ.vine={ph:'gone',t:0,next:150,dir:1,len:0};
 for(const p of STG.plats)if(p.vine){p.x1=p.x2=-150*WS;p.y=-9999;}
 for(const p of STG.plats)if(p.gond!==undefined)layGond(p,0);
 if(STG.origami)origamiGeo();if(STG.spot)spotBody();if(STG.ship)for(const p of STG.plats)if(p.jet!==undefined)layJet(p);
 for(const p of STG.plats){if(p.lan){p.cx0=p.lan.cx;layLantern(p,0);}if(p.toast){p.y=-58*YS;p.vy=0;}}}
function layLantern(p,t){const l=p.lan,a=l.A*Math.sin(t*l.w+l.ph),w=p.x2-p.x1,ox=p.x1,oy=p.y;const cx=l.cx+l.L*Math.sin(a);
 p.x1=cx-w/2;p.x2=cx+w/2;p.y=-520*YS+l.L*Math.cos(a);p.vx=p.x1-ox;p.vy=p.y-oy;p.ang=a;}
function hazHit(f,d,a,b,g,dir,key,cd){const k=f.slot+key;if((HZ.cd.get(k)||0)>frame||!canBeHit(f))return false;HZ.cd.set(k,frame+cd);launch(f,d,a,b,g,dir,null,false);f.hitlag=4;return true;}
// Clank's Workshop: conveyor belts in the bench top
function beltPushAt(x){if(!STG.belts)return 0;for(const [a,b] of STG.belts)if(x>a&&x<b)return HZ.belt*1.4;return 0;}
function beltPush(f){if(!STG.belts||f.ground!==STG.main)return 0;for(const [a,b] of STG.belts)if(f.x>a&&f.x<b)return HZ.belt*1.4;return 0;}
// Ferris Wheel: gondola roofs ride the rim; position comes from the shared frame counter so both phones agree
function layGond(p,t){const W=STG.wheel,a=t*W.w+p.gond*Math.PI/3,w=84,ox=p.x1,oy=p.y;const hx=W.cx+W.r*Math.cos(a),hy=W.cy+W.r*Math.sin(a);
 p.x1=hx-w/2;p.x2=hx+w/2;p.y=hy+8;p.vx=p.x1-ox;p.vy=p.y-oy;if(t===0){p.vx=p.vy=0;}}
// Origami: the sheet folds its sides up into walls, pops a block up out of the middle, or flips over.
// All geometry is rebuilt from HZ state every frame, so both phones build the same stage.
function foldA(side){if(HZ.ofk!=='fold')return 0;const on=HZ.ofs===0||HZ.ofs===side;if(!on)return 0;if(HZ.ofp==='fold')return Math.min(1,HZ.oft/30);if(HZ.ofp==='folded')return 1;if(HZ.ofp==='unfold')return Math.max(0,1-HZ.oft/30);return 0;}
function popY(){if(HZ.ofk!=='pop')return 9999;if(HZ.ofp==='rise')return lerp(0,-120*YS,Math.min(1,HZ.oft/30));if(HZ.ofp==='up')return -120*YS;if(HZ.ofp==='lower')return lerp(-120*YS,0,Math.min(1,HZ.oft/30));return 9999;}
function dropRiders(surf){for(const f of fighters){if(f.ground===surf){f.ground=null;if(f.state!=='attack')setState(f,'air');}if(f.state==='ledge'&&f.ledge&&f.ledge.plat===surf)ledgeDrop(f);}}
function layCrane(p,t){if(!p.cw)p.cw=p.x2-p.x1;const a=t*0.0042+p.crane*Math.PI,ox=p.x1,oy=p.y;const cx=Math.sin(a)*270*WS,cy=(-200+Math.sin(2*a)*55)*YS;
 p.x1=cx-p.cw/2;p.x2=cx+p.cw/2;p.y=cy;p.vx=t?p.x1-ox:0;p.vy=t?p.y-oy:0;p.dir=Math.cos(a)>=0?1:-1;}
function origamiGeo(){const busy=HZ.ofk==='fold'&&(HZ.ofp==='fold'||HZ.ofp==='folded'||HZ.ofp==='unfold');const body=[[STG.main.x1,0,STG.main.x2,26]];
 for(const sv of STG.solids){
  if(sv.flap){const on=busy&&(HZ.ofs===0||HZ.ofs===sv.flap);const y=on?9999:0;if(y!==sv.y){if(y>5000)dropRiders(sv);sv.y=y;}if(!on)body.push([sv.x1,0,sv.x2,26]);}
  if(sv.top){const on=busy&&HZ.ofp==='folded'&&(HZ.ofs===0||HZ.ofs===sv.top);const y=on?STG.walls[0].top:9999;if(y!==sv.y){if(y>5000)dropRiders(sv);sv.y=y;}}
  if(sv.pop){const y=popY(),oy=sv.y;sv.vy=oy<5000&&y<5000?y-oy:0;if(y!==oy&&y>5000)dropRiders(sv);sv.y=y;if(y<-2)body.push([sv.x1,y,sv.x2,0]);}}
 STG.body=body;for(const w of HZ.walls)if(w.fold){const on=busy&&HZ.ofp==='folded'&&(HZ.ofs===0||HZ.ofs===w.fold);w.bot=on?0:w.top;}
 for(const L of LEDGES)L.y=L.plat.y;
 for(const p of STG.plats)if(p.crane!==undefined)layCrane(p,HZ.k);
 for(const f of fighters)if(f.state==='ledge'&&f.ledge&&!ledgeOK(f.ledge))ledgeDrop(f);}
function ledgeOK(L){if(L.plat.y>5000)return false;
 if(STG.origami){if(L.plat.pop&&L.plat.y>-20)return false;if(L.plat.flap&&((L.plat.flap<0&&L.side<0)||(L.plat.flap>0&&L.side>0)))return false; // a flap's inner edge is the crease
  if(L.plat===STG.main){const side=L.side>0?-1:1;const fl=STG.solids.find(sv=>sv.flap===side);if(fl&&fl.y<5000)return false;}}
 if(STG.spot&&L.plat===STG.main&&tileOpenAt(L.x+L.side*20))return false;
 return true;}
// Center Stage: trapdoor tiles in the boards and catwalks that give way under whoever's winning
function tileOpenAt(x){const T=STG.tiles;if(!T||!HZ.tl)return false;for(let k=0;k<T.length-1;k++)if(x>T[k]&&x<T[k+1])return HZ.tl[k]&&HZ.tl[k].st==='open';return false;}
function spotBody(){const T=STG.tiles,b=[];for(let k=0;k<T.length-1;k++)if(!HZ.tl[k]||HZ.tl[k].st!=='open')b.push([T[k],0,T[k+1],36]);STG.body=b;}
function findLeader(){if(!G||G.attract||G.training)return -1;const alive=fighters.filter(f=>!f.out);if(alive.length<2)return -1;

function groundAttack(f){
 const i=f.inp;const sd=f.flickT<=7?{x:f.flickX,y:f.flickY}:null;
 if(f.itm&&ITEM[f.itm].cat==='weapon'){if(sd&&sd.x&&f.state!=='run'){f.face=sd.x;weaponMove(f,'s');}else{if(Math.abs(i.x)>0.35)f.face=sgn(i.x);weaponMove(f,'t');}return;}
 if(f.state==='dash'||f.state==='run'){
  if(sd&&sd.y<0){startMove(f,'usmash');return;}
  if(sd&&sd.x&&f.state==='dash'&&f.sf<8){f.face=sd.x;startMove(f,'fsmash');return;}
  startMove(f,'dash');return;}
 if(sd){if(sd.y<0)startMove(f,'usmash');else if(sd.y>0)startMove(f,'dsmash');else{f.face=sd.x;startMove(f,'fsmash');}return;}
 const ax=Math.abs(i.x),ay=Math.abs(i.y);
 if(ay>ax&&ay>0.4){startMove(f,i.y<0?'utilt':'dtilt');return;}
 if(ax>0.35){f.face=sgn(i.x);startMove(f,'ftilt');return;}
 startMove(f,'jab');
}
function aerial(f){
 const i=f.inp;let x=i.x,y=i.y;
 if(f.itm&&ITEM[f.itm].cat==='weapon'){weaponMove(f,'a');return;}
 if(f.flickT<=4){if(f.flickX){x=f.flickX;y=0;}else if(f.flickY){y=f.flickY;x=0;}}
 const ax=Math.abs(x),ay=Math.abs(y);
 if(ay>=ax&&ay>0.45)startMove(f,y<0?'uair':'dair');
 else if(ax>0.35)startMove(f,x*f.face>0?'fair':'bair');
 else startMove(f,'nair');
}
function special(f){
 const i=f.inp,ax=Math.abs(i.x),ay=Math.abs(i.y);
 if(ay>ax&&i.y<-0.45){if(!f.ground&&f.upB)return false;f.upB=true;startMove(f,'ub');return true;}
 if(ay>ax&&i.y>0.45){startMove(f,'db');return true;}
 if(ax>0.45){if(f.sbCD>0)return false;f.face=sgn(i.x);if(!f.ground){if(f.sideB)return false;f.sideB=true;}startMove(f,'sb');return true;}
 startMove(f,'nb');return true;
}
function spawnBubble(f){
 if(projectiles.some(p=>p.owner===f&&p.k==='bubble'))return;
 projectiles.push({k:'bubble',owner:f,x:f.x+f.face*28,y:f.y-f.h/2-4,vx:f.face*3.6,vy:0,t:0,len:95,r:16});snd('pop',.4);
}
function makePuddle(f){
 if(!f.ground||f.ground.moving)return;
 for(let i=puddles.length-1;i>=0;i--)if(puddles[i].owner===f)puddles.splice(i,1);
 const s=f.ground;puddles.push({owner:f,surf:s,x1:Math.max(s.x1,f.x-62),x2:Math.min(s.x2,f.x+62),y:s.y,t:0,len:360});
}
function startLag(f,n){setState(f,'land');f.lagLen=n;f.move=null;f.armor=false;}
function startJumpsquat(f){setState(f,'jumpsquat');f.move=null;}
function roll(f,dir){setState(f,'roll');f.rollDir=dir;f.move=null;}

/* ---------------- state step ---------------- */
function tryGround(f){
 const tapUp=f.tapJump&&f.flickT===0&&f.flickY<0;
 if(f.itm==='hammer'){if(pr(f,'s')||(pr(f,'z')&&f.inp.y>0.6)){f.itm=null;f.hamT=0;snd('thud',.3);return false;}if(pr(f,'j')||tapUp){startJumpsquat(f);return true;}return false;}
 if(pr(f,'z')&&f.itm){throwItem(f);return true;}
 if(pr(f,'s')&&f.itm&&f.itm!=='hammer'){dropItem(f);setState(f,'shield');return true;}
 if(pr(f,'a')&&!f.itm&&tryPickup(f))return true;
 if(pr(f,'a')&&f.itm&&ITEM[f.itm].cat==='throw'){throwItem(f);return true;}
 if(pr(f,'j')||tapUp){startJumpsquat(f);return true;}
 if(f.inp.s){if(f.flickT<=1&&f.flickX){roll(f,f.flickX);return true;}setState(f,'shield');return true;}
 if(pr(f,'z')){startMove(f,'grab');return true;}
 if(pr(f,'a')){groundAttack(f);return true;}
 if(pr(f,'b')){special(f);return true;}
 return false;
}
function tryAir(f){
 const tapUp=f.tapJump&&f.flickT===0&&f.flickY<0;
 if(f.itm==='hammer')return false;
 if(pr(f,'z')){if(f.itm){throwItem(f);return true;}if(tryPickup(f,true))return true;}
 if(pr(f,'s')&&f.itm){dropItem(f);}
 if(pr(f,'a')&&f.itm&&ITEM[f.itm].cat==='throw'){throwItem(f);return true;}
 if(f.tj&&f.sf<=4&&f.state==='air'&&pr(f,'b')&&f.inp.y<-0.4){f.jumps++;f.vx=f.tj.vx;f.vy=f.tj.vy;f.tj=null;}
 else if((pr(f,'j')||tapUp)&&f.jumps>0){f.tj=pr(f,'j')?null:{vx:f.vx,vy:f.vy};f.jumps--;f.vy=-f.c.ajump;f.vx=f.inp.x*f.c.airSpd;f.ff=false;f.tumbling=false;setState(f,'air');snd('jump',.25);
  if(f.id==='mochi')fxPush({k:'ring',x:f.x,y:f.y,t:0,len:14,s:22,col:'#ffffff'});return true;}
 if(pr(f,'s')){airdodge(f);return true;}
 if(pr(f,'a')){aerial(f);return true;}
 if(pr(f,'b')){return special(f);}
 return false;
}
function airdodge(f){
 setState(f,'airdodge');f.move=null;f.tumbling=false;f.ff=false;
 let x=f.inp.x,y=f.inp.y;const m=Math.hypot(x,y);
 if(m>0.3){x/=m;y/=m;f.vx=x*10.5;f.vy=y*10.5;}else{f.vx*=0.2;f.vy=0;}
}
function friction(f,mul){const t=f.c.traction*(mul||1)*(f.slickT>0?0.08:1);if(Math.abs(f.vx)<=t)f.vx=0;else f.vx-=sgn(f.vx)*t;}
function airDrift(f,mul){
 mul=mul||1;const c=f.c,x=f.inp.x;
 if(Math.abs(x)>0.2){const tx=x*c.airSpd*mul;if(f.vx<tx)f.vx=Math.min(tx,f.vx+c.airAcc);else if(f.vx>tx&&sgn(x)===sgn(f.vx)){/*keep momentum*/}else if(f.vx>tx)f.vx=Math.max(tx,f.vx-c.airAcc);}
 else{if(Math.abs(f.vx)<=c.airFric)f.vx=0;else f.vx-=sgn(f.vx)*c.airFric;}
}
function fastFall(f){if(!f.ground&&f.vy>=-0.5&&f.flickT===0&&f.flickY>0&&!f.ff){f.ff=true;f.vy=f.c.ffall;}}

function groundMove(f){
 if(!f.ground){setState(f,'air');return;}
 if(tryGround(f))return;
 if(!f.ground){if(f.state!=='attack'&&f.state!=='jumpsquat')setState(f,'air');return;}
 const c=f.c,x=f.inp.x,ax=Math.abs(x);
 if(f.ground.soft&&f.downT>=4){f.ground=null;f.dropT=12;f.y+=2;setState(f,'air');return;}
 if(f.state==='dash'){
  if(f.sf===1)f.vx=f.face*c.dash;
  if(f.flickT===0&&f.flickX&&f.flickX!==f.face){f.face=f.flickX;setState(f,'dash');f.vx=f.face*c.dash;return;}
  if(f.sf>=12){if(ax>0.6&&sgn(x)===f.face)setState(f,'run');else setState(f,'idle');}
  return;}
 if(f.state==='run'){
  if(ax>0.6&&sgn(x)===f.face){f.vx=f.face*c.run;return;}
  if(ax>0.6){f.face=sgn(x);f.vx*=0.4;setState(f,'dash');return;}
  setState(f,'idle');}
 if(f.flickT===0&&f.flickX){f.face=f.flickX;setState(f,'dash');f.vx=f.face*c.dash;dust(f.x,f.y,3);return;}
 if(f.inp.y>0.6&&ax<0.5){if(f.state!=='crouch')setState(f,'crouch');friction(f);return;}
 if(ax>0.22){f.face=sgn(x);if(f.state!=='walk')setState(f,'walk');const tv=x*c.walk;f.vx+=clamp(tv-f.vx,-0.5,0.5);}
 else{if(f.state!=='idle')setState(f,'idle');friction(f);}
}

function stepFighter(f){
 if(f.out)return;
 charTick(f);
 updateFlicks(f);
 if(f.hitlag>0){f.hitlag--;f.lagged=1;
  if(f.state==='hitstun'&&f.flickT===0&&(f.flickX||f.flickY))nudge(f,f.flickX*6,f.flickY*6);
  unsink(f);return;}
 f.lagged=0;
 f.sf++;f.noGrav=0;f.intan=false;f.hovering=0;f.drum=false;f.reflect=false;f.low=false;
 if(f.inv>0)f.inv--;if(f.sbCD>0)f.sbCD--;if(f.slickT>0)f.slickT--;if(f.ropeCD>0)f.ropeCD--;if(f.ledgeCD>0)f.ledgeCD--;if(f.dropT>0)f.dropT--;if(f.pumT>0)f.pumT--;if(f.flash>0)f.flash--;if(f.lc>0)f.lc--;if(f.c.wind&&f.fuel>=100&&frame%30===0)fxPush({k:'spark',x:f.x-f.face*26,y:f.y-32,t:0,len:8,s:8,col:'#ffd166'});if(f.slowT>0){f.slowT--;if(f.slowT%9===0)fxPush({k:'water',x:f.x+(rand()-.5)*f.w,y:f.y-f.h*0.5,vx:0,vy:1.2,t:0,len:18,s:4,mint:1});}
 f.lcT++;f.sT++;if(pr(f,'s')){f.lcT=0;f.sT=0;}
 if(f.state!=='shield'&&f.state!=='shieldstun')f.shield=Math.min(60,f.shield+0.07);
 if(f.c.fuel&&!(f.state==='attack'&&f.move&&f.move.name==='nb'))f.fuel=Math.min(100,f.fuel+0.35);
 const i=f.inp,c=f.c;
 switch(f.state){
  case 'idle':case 'walk':case 'dash':case 'run':case 'crouch':
   if(!f.ground){setState(f,'air');break;}groundMove(f);break;
  case 'jumpsquat':
   if(pr(f,'a')&&f.inp.y<-0.3){startMove(f,'usmash');break;}
   if(pr(f,'z')){startMove(f,'grab');break;}
   if(pr(f,'b')){special(f);break;}
   friction(f,0.5);
   if(f.sf>=c.jsq){const held=i.j||(f.tapJump&&i.y<-0.5);f.ground=null;f.vy=-(held?c.jump:c.hop);
    f.vx=clamp(f.vx*0.7+i.x*c.airSpd*0.6,-c.airSpd*1.1,c.airSpd*1.1);f.y-=1;setState(f,'air');snd('jump',.2);dust(f.x,f.y+1,4);}
   break;
  case 'air':
   if(tryAir(f))break;
   airDrift(f);fastFall(f);ropeCheck(f);
   if(f.c.hover&&f.vy>=0&&f.hoverF>0&&!f.ff&&(f.inp.j||(f.tapJump&&f.inp.y<-0.55))){f.vy=Math.min(f.vy,0.3);f.hoverF--;f.hovering=1;}
   if(f.c.float&&f.vy>=0&&f.hoverF>0&&!f.ff&&(f.inp.j||(f.tapJump&&f.inp.y<-0.55))){f.vy=Math.min(f.vy,0.9);f.hoverF--;f.hovering=1;}
   ledgeCheck(f);break;
  case 'special_fall':
   airDrift(f,0.55);fastFall(f);ropeCheck(f);ledgeCheck(f);break;
  case 'attack':stepAttack(f);break;
  case 'land':
   if(!f.ground){setState(f,'air');break;}
   friction(f,f.lagLen>=10?0.6:1);if(f.sf>=f.lagLen){setState(f,'idle');groundMove(f);}break;
  case 'shield':
   if(!i.s){startLag(f,7);break;}
   if(pr(f,'j')||(f.tapJump&&f.flickT===0&&f.flickY<0)){startJumpsquat(f);break;}
   if(pr(f,'a')||pr(f,'z')){startMove(f,'grab');break;}
   if(f.flickT===0&&f.flickX){roll(f,f.flickX);break;}
   if(f.flickT===0&&f.flickY>0){if(f.ground&&f.ground.soft){f.ground=null;f.dropT=12;f.y+=2;setState(f,'air');break;}setState(f,'spotdodge');break;}
   f.shield-=0.28;friction(f);if(f.shield<=0)shieldBreak(f);break;
  case 'shieldstun':
   friction(f,0.5);if(f.sf>=f.lagLen){if(i.s)setState(f,'shield');else setState(f,'idle');}break;
  case 'roll':{const n=f.sf,dg=f.c.dodge;f.intan=dg?n>=2&&n<=24:n>=4&&n<=19;if(n>=4&&n<=24)f.vx=f.rollDir*(dg?6.6:5.2);else f.vx*=0.6;
   if(n>=32){f.face=-f.rollDir;setState(f,'idle');}break;}
  case 'spotdodge':f.intan=f.c.dodge?f.sf>=1&&f.sf<=21:f.sf>=2&&f.sf<=16;friction(f);if(f.sf>=24)setState(f,'idle');break;
  case 'airdodge':
   f.intan=f.c.dodge?f.sf>=2&&f.sf<=29:f.sf>=4&&f.sf<=25;f.noGrav=f.sf<28?1:0;f.vx*=0.9;f.vy*=0.9;if(f.sf>=30){setState(f,'special_fall');}break;
  case 'hitstun':
   f.hitstun--;if(!f.ground){if(f.hitstun<20&&f.tumble){/* allow slight drift late */}}
   else friction(f,0.6);
   if(f.hitstun<=0){if(f.ground)setState(f,'idle');else{setState(f,'air');f.tumbling=f.tumble;}}
   break;
  case 'tech':f.intan=f.sf<=20;if(f.rollDir){if(f.sf<=24)f.vx=f.rollDir*4;else f.vx*=0.6;}else friction(f);
   if(f.sf>=(f.rollDir?40:26)){setState(f,'idle');}break;
  case 'lying':
   friction(f);
   if(f.sf>8){if(Math.abs(i.x)>0.6){setState(f,'getup');f.rollDir=sgn(i.x);}
    else if(i.y<-0.6||pr(f,'a')||pr(f,'j')||pr(f,'b')||f.sf>60){setState(f,'getup');f.rollDir=0;}}
   break;
  case 'getup':f.intan=f.sf<=22;if(f.rollDir){if(f.sf<=26)f.vx=f.rollDir*3.4;else f.vx*=0.6;}else friction(f);
   if(f.sf>=(f.rollDir?36:30))setState(f,'idle');break;
  case 'ledge':stepLedge(f);break;
  case 'ledgeclimb':{f.intan=true;const L=f.ledge;if(f.sf>=24){f.x=L.x+L.side*(f.w/2+2);f.y=L.y;f.ground=L.plat||STG.main;f.ledge=null;setState(f,'idle');}break;}
  case 'grab':stepGrab(f);break;
  case 'held':{const h=f.holder;if(!h||h.held!==f||(h.state!=='grab'&&h.state!=='throw')){f.holder=null;setState(f,f.ground?'idle':'air');}
   else{if(pr(f,'a')||pr(f,'b')||pr(f,'j')||(f.flickT===0))h.grabT-=4;}break;}
  case 'throw':stepThrow(f);break;
  case 'shieldbreak':f.noGrav=0;break;
  case 'dizzy':friction(f);if(pr(f,'a')||pr(f,'b')||pr(f,'j')||f.flickT===0)f.sf+=5;if(f.sf>=f.dizzyLen)setState(f,'idle');break;
  case 'swallowed':{f.noGrav=1;f.vx=f.vy=f.kvx=f.kvy=0;const h=fighters.find(q=>q.mouth===f);if(!h||h.out||h.state!=='attack'||!h.move||h.move.name!=='nbfull'){if(h)h.mouth=null;setState(f,'air');f.inv=Math.max(f.inv,10);break;}
   f.x=h.x;f.y=h.y;if(pr(f,'a')||pr(f,'b')||pr(f,'j')||f.flickT===0)h.mouthMax-=3;break;}
  case 'squeezed':f.noGrav=1;f.vx=f.vy=f.kvx=f.kvy=0;if(G.boss&&(pr(f,'a')||pr(f,'b')||pr(f,'j')||f.flickT===0))G.boss.sqT-=5;break;
  case 'bubbled':
   f.noGrav=1;f.vy=-0.35;f.vx*=0.9;f.bubbleT--;if(pr(f,'a')||pr(f,'b')||pr(f,'j')||f.flickT===0)f.bubbleT-=4;
   if(f.bubbleT<=0){setState(f,'air');snd('pop',.5);fxPush({k:'ring',x:f.x,y:f.y-f.h/2,t:0,len:12,s:f.h*0.9,col:'#ffffff'});}break;
  case 'rope':{const Rp=STG.rope;f.noGrav=1;f.ropeV+=-(0.38/f.ropeL)*Math.sin(f.ropeA)+f.inp.x*0.0022;f.ropeV*=0.996;f.ropeA=clamp(f.ropeA+f.ropeV,-1.35,1.35);
   f.x=Rp.x+f.ropeL*Math.sin(f.ropeA);f.y=Rp.y+f.ropeL*Math.cos(f.ropeA)+f.h*0.75;if(Math.abs(f.inp.x)>0.3)f.face=sgn(f.inp.x);
   const go=pr(f,'j')||(f.tapJump&&f.flickT===0&&f.flickY<0)||pr(f,'a')||pr(f,'b');
   if(go||f.flickT===0&&f.flickY>0||f.sf>240){const w=f.ropeV*f.ropeL;f.vx=clamp(w*Math.cos(f.ropeA)*1.1,-9,9);f.vy=go?Math.min(-f.c.ajump*0.85,-w*Math.sin(f.ropeA)-3):0;
    setState(f,'air');f.ropeCD=40;if(go)snd('jump',.3);}
   break;}
  case 'fold':f.noGrav=1;f.intan=true;f.vx=f.vy=0;f.kvx*=0.9;f.kvy*=0.9;f.x+=f.kvx;f.y+=f.kvy;if(f.sf%6===0)fxPush({k:'voidp',x:f.x+(rand()-.5)*40,y:f.y-f.h/2+(rand()-.5)*40,vx:0,vy:0,t:0,len:20,s:6,tx:f.x,ty:f.y-f.h/2});
   if(f.sf>=55){fxPush({k:'ring',x:f.x,y:f.y-f.h/2,t:0,len:20,s:40,col:'#b388ff'});ko(f);}break;
  case 'respawn':
   f.noGrav=1;f.vx=0;f.vy=0;f.inv=Math.max(f.inv,120);
   if((f.sf>30&&(Math.abs(i.x)>0.3||Math.abs(i.y)>0.3||i.a||i.b||i.j||i.s))||f.sf>300){setState(f,'air');f.inv=120;}
   break;
 }
 physics(f);
 if(f.itm==='hammer')hammerStep(f);
 if(f.starT>0){f.starT--;f.inv=Math.max(f.inv,2);if(frame%4===0)fxPush({k:'spark',x:f.x+(rand()-.5)*f.w,y:f.y-rand()*f.h,t:0,len:10,s:8,col:`hsl(${frame*8%360},95%,65%)`});}
 if(f.sizeT>0){f.sizeT--;if(f.sizeT===0){setSize(f,1);snd('pop',.4);}}
}

function stepAttack(f){
 const m=f.move;if(!m){endMove(f);return;}
 if(m.charge&&f.mf===m.charge&&f.inp.a&&f.chargeT<60){f.chargeT++;if(f.chargeT%8===0)f.flash=3;}
 else{f.mf++;if(m.charge&&f.mf===m.charge+1)snd('swing',.35);}
 f.armor=m.armor===1||(Array.isArray(m.armor)&&f.mf>=m.armor[0]&&f.mf<=m.armor[1]);
 if(m.intan)f.intan=f.mf>=m.intan[0]&&f.mf<=m.intan[1];
 if(m.update)m.update(f,f.mf);
 if(f.move!==m)return;
 if(!f.ground){if(!m.noDrift)airDrift(f);if(m.air)fastFall(f);}
 else if(!m.keepVel)friction(f);
 if(!f.ground&&m.ledgeFrom&&f.mf>=m.ledgeFrom&&ledgeCheck(f))return;
 if(!m.loop&&f.mf>=m.len)endMove(f);
}

/* ---------------- ledge ---------------- */
function ropeCheck(f){const Rp=STG.rope;if(!Rp||f.ropeCD>0||f.ground||f.state==='rope')return false;
 if(fighters.some(o=>o!==f&&o.state==='rope'))return false;
 const hx=f.x,hy=f.y-f.h*0.75,dx=hx-Rp.x,dy=hy-Rp.y;if(dy<20||dy>Rp.len+10)return false;
 const a=Math.atan2(dx,dy),d=Math.hypot(dx,dy);const sway=Math.sin(frame*0.02)*0.08;if(Math.abs(a-sway)>0.22)return false;
 setState(f,'rope');f.move=null;f.ropeA=a;f.ropeL=clamp(d,50,Rp.len);f.ropeV=clamp((f.vx||0)/f.ropeL,-0.06,0.06);f.vx=f.vy=f.kvx=f.kvy=0;f.ff=false;f.jumps=f.c.njumps;f.upB=false;f.sideB=false;f.tumbling=false;snd('grabl',.4);return true;}
function ledgeTaken(L,f){return fighters.some(o=>o!==f&&!o.out&&(o.state==='ledge'||o.state==='ledgeclimb')&&o.ledge===L);}
function ledgeCheck(f){
 if(f.ground||f.ledgeCD>0||f.inp.y>0.6)return false;
 const rec=f.state==='attack'&&f.move&&f.move.ledgeFrom;
 if(f.vy<-1&&!rec)return false;
 for(const L of LEDGES){if(ledgeTaken(L,f)||!ledgeOK(L))continue;
  const dx=(L.x-f.x)*L.side;
  if(dx>-6&&dx<f.w/2+38&&f.y>L.y-14&&f.y-f.h<L.y+70){grabLedge(f,L);return true;}}
 return false;
}
function grabLedge(f,L){
 setState(f,'ledge');f.ledge=L;f.face=L.side;f.move=null;f.armor=false;f.x=L.x-L.side*(f.w*0.42);f.y=L.y+f.h*0.82;
 f.vx=f.vy=f.kvx=f.kvy=0;f.ff=false;f.jumps=f.c.njumps;f.upB=false;f.sideB=false;f.tumbling=false;f.hoverF=f.c.hover||f.c.float||0;
 f.ledgeN=(f.ledgeN||0)+1;if(f.ledgeN<=6)f.inv=Math.max(f.inv,30);
 snd('grabl',.3);
}
function stepLedge(f){
 const L=f.ledge,i=f.inp;f.vx=f.vy=0;
 const toward=i.x*L.side;
 if(f.sf>=2&&f.sf<8&&(i.y>0.6||toward<-0.6)){ledgeDrop(f);return;}

 for(let pass=0;pass<3;pass++){let hit=null;for(const r of STG.body)if(f.x>r[0]&&f.x<r[2]&&f.y-1>r[1]+0.5&&f.y-1<r[3]){hit=r;break;}if(!hit)return;const r=hit,up=f.y-r[1];
  if(up<=48&&(f.ground||f.vy+f.kvy>=-0.5)){f.y=r[1];const S=solidsOf().find(S=>S.y<5000&&Math.abs(S.y-r[1])<2&&f.x>=S.x1-1&&f.x<=S.x2+1);if(S)f.ground=S;else if(f.ground&&Math.abs(f.ground.y-r[1])>2)f.ground=null;}
  else{const L=f.x-r[0],R=r[2]-f.x,d=L<R?-1:1;f.x=d<0?r[0]-1:r[2]+1;if(sgn(f.vx)===-d)f.vx=0;if(sgn(f.kvx)===-d)f.kvx=-f.kvx*0.3;
   if(f.ground){const S=solidsOf().find(S=>S.y<5000&&Math.abs(S.y-f.ground.y)<1&&f.x>=S.x1-1&&f.x<=S.x2+1);if(!S)f.ground=null;}}}}
function unsink(f){unbury(f);if(f.ground&&f.ground.y<5000&&f.y>f.ground.y&&f.y-f.ground.y<60)f.y=f.ground.y;if(f.ground){if(!(f.ground.moving||f.ground.soft)||!inBody(f.x,f.y))return;f.ground=null;}if(f.out||['ledge','ledgeclimb','held','respawn','rope','fold','squeezed','swallowed'].includes(f.state))return;
 if(!inBody(f.x,f.y))return;let best=null;
 for(const S of solidsOf()){if(S.y>5000||f.x<S.x1-1||f.x>S.x2+1||S.y>f.y+0.5)continue;if(STG.spot&&S===STG.main&&tileOpenAt(f.x))continue;if(!best||S.y>best.y)best=S;}
 if(!best)return;f.y=best.y;f.x=clamp(f.x,best.x1,best.x2);if(f.kvy>0)f.kvy=0;if(f.vy>0)f.vy=0;land(f,best);}
function nudge(f,dx,dy){f.x+=dx;if(!f.ground&&dy){const oy=f.y;f.y+=dy;if(dy>0)for(const S of solidsOf()){if(S.y>5000||f.x<S.x1||f.x>S.x2)continue;if(oy<=S.y&&f.y>S.y){f.y=S.y-0.5;break;}}}unsink(f);}
function land(f,s){
 f.ground=s;f.ledgeInvUsed=false;f.ledgeN=0;
 const st=f.state,fall=f.vy+f.kvy;
 f.vy=0;f.kvy=0;f.ff=false;f.jumps=f.c.njumps;f.upB=false;f.sideB=false;f.hoverF=f.c.hover||f.c.float||0;
 if(st==='attack'){const m=f.move;
  if(m&&m.onLand){m.onLand(f);return;}
  if(m&&m.air){let ll=m.ll||10;if(f.lcT<=7){ll=Math.ceil(ll/2);f.lc=10;}startLag(f,ll);return;}
  return;}
 if(st==='airdodge'){f.vx*=0.7;startLag(f,10);if(Math.abs(f.vx)>2)dust(f.x,f.y,3);return;}
 if(st==='special_fall'){startLag(f,10);return;}
 if(st==='hitstun'||(st==='air'&&f.tumbling)){
  if(f.sT<=20){setState(f,'tech');f.rollDir=Math.abs(f.inp.x)>0.5?sgn(f.inp.x):0;f.kvx=0;f.vx=0;f.hitstun=0;f.tumbling=false;snd('tech',.4);fxPush({k:'ring',x:f.x,y:f.y-f.h/2,t:0,len:10,s:30,col:'#ffffff'});return;}
  if(f.tumble||f.tumbling){setState(f,'lying');f.kvx*=0.3;f.tumbling=false;f.hitstun=0;dust(f.x,f.y,8);snd('thud',.4);return;}
  return;}
 if(st==='shieldbreak'){setState(f,'dizzy');return;}
 if(st==='air'){startLag(f,fall>5?4:2);if(fall>4)dust(f.x,f.y,4);return;}
}

/* ---------------- projectiles & hazards ---------------- */
function stepProjectiles(){
 for(let k=projectiles.length-1;k>=0;k--){const p=projectiles[k];p.t++;
  if(p.k==='bubble'){p.x+=p.vx;p.vx*=0.995;p.y+=Math.sin(p.t*0.15)*0.6;
   let gone=p.t>=p.len||p.owner.out;
   if(!gone&&bossTouch(p.x,p.y,p.r,p.owner,3))gone=true;
   for(const t of fighters){if(gone)break;if(t===p.owner||!canBeHit(t)||t.state==='held'||t.state==='bubbled'||friendly(p.owner,t))continue;
    const sh=t.state==='shield'||t.state==='shieldstun';
    if(sh){if((p.x-t.x)**2+(p.y-(t.y-t.h/2))**2<=(p.r+shieldR(t))**2){shieldHit(p.owner,t,4,p.x,p);gone=true;snd('pop',.4);}continue;}
    if((t.drum||t.reflect)&&drumHit(t,p.x,p.y,p.r)&&sgn(p.vx)===-t.face){reflect(p,t);continue;}
    if(circRect(p.x,p.y,p.r,hurtHit(t))){
     t.pct=Math.min(999,t.pct+3);t.hud=8;p.owner.dmgDone+=3;
     if(t.holder){const h=t.holder;h.held=null;t.holder=null;setState(h,'idle');}
     if(t.held){const h=t.held;h.holder=null;t.held=null;setState(h,'idle');}
     if(t.state==='ledge')t.ledge=null;
     t.move=null;t.armor=false;setState(t,'bubbled');t.ground=null;t.bubbleT=Math.min(140,40+t.pct*0.6);t.vx=p.vx*0.3;t.vy=0;t.kvx=t.kvy=0;t.ff=false;
     t.lastHit=p.owner;t.lastHitF=frame;snd('pop',.7);gone=true;}
   }
   if(gone){projectiles.splice(k,1);fxPush({k:'ring',x:p.x,y:p.y,t:0,len:10,s:p.r*1.4,col:'#ffffff'});}
  }
  else if(p.boom){p.vx-=p.boom*0.22;if(sgn(p.vx)!==p.boom||p.t>60){const o=p.owner,tx=o.x,ty=o.y-o.h*0.9;p.vy=(ty-p.y)*0.08;p.vx=clamp(p.vx,-9,9);if(Math.abs(p.vx)>2&&sgn(p.vx)!==sgn(tx-p.x)&&p.t>40)p.vx=sgn(tx-p.x)*Math.abs(p.vx);
    if(Math.hypot(tx-p.x,ty-p.y)<26||p.t>=p.len||o.out){projectiles.splice(k,1);continue;}}
   p.x+=p.vx;p.y+=p.vy;
   if(!p.hitB&&bossTouch(p.x,p.y,p.r,p.owner,p.hb.d))p.hitB=1;
   for(const t of fighters){if(t===p.owner||!canBeHit(t)||p.hitT===t||friendly(p.owner,t))continue;const sh=t.state==='shield'||t.state==='shieldstun';
    if(sh){if((p.x-t.x)**2+(p.y-(t.y-t.h/2))**2<=(p.r+shieldR(t))**2){shieldHit(p.owner,t,p.hb.d,p.x,p);p.hitT=t;}continue;}
    if(circRect(p.x,p.y,p.r,hurtHit(t))){hitTarget(p.owner,t,p.hb,p.x,p.y,1,p);p.hitT=t;}}}
  else if(p.k!=='bubble'){const py=p.y;p.vy+=p.k==='coconut'?0.28:p.g;p.x+=p.vx;p.y+=p.vy;p.bounce=p.bounce||0;
   for(const sf of SURF){if(p.vy>0&&py<=sf.y+1&&p.y>=sf.y-(p.roll?p.r:0)&&p.x>=sf.x1&&p.x<=sf.x2){if(p.roll){p.y=sf.y-p.r;p.vy=0;p.vx+=(sf.vx||0)*0.02;}else if(p.k==='wax'){makeWax(p,sf);p.bounce=9;}else if(p.k==='coconut'||p.k==='fish'){p.y=sf.y-0.5;p.vy=-p.vy*0.45;p.vx*=0.7;p.bounce++;snd('thud',.25);}else{p.bounce=9;}break;}}
   let gone=p.t>=p.len||p.bounce>=3||p.owner.out||p.y>STG.blast.b;
   if(!gone&&bossTouch(p.x,p.y,p.r,p.owner,p.hb.d*(p.bounce?0.75:1)))gone=true;
   for(const t of fighters){if(gone)break;if(t===p.owner||!canBeHit(t)||friendly(p.owner,t))continue;
    if((t.drum||t.reflect)&&drumHit(t,p.x,p.y,p.r)&&sgn(p.vx)===-t.face){reflect(p,t);continue;}
    const sh=t.state==='shield'||t.state==='shieldstun';
    if(sh){if((p.x-t.x)**2+(p.y-(t.y-t.h/2))**2<=(p.r+shieldR(t))**2){shieldHit(p.owner,t,p.hb.d,p.x,p);gone=true;}continue;}
    if(circRect(p.x,p.y,p.r,hurtHit(t))){hitTarget(p.owner,t,p.hb,p.x,p.y,p.bounce?0.75:1,p);gone=true;}}
   if(gone){projectiles.splice(k,1);fxPush({k:'dust',x:p.x,y:p.y,vx:0,vy:0,t:0,len:16,s:8});}
  }
 }
 for(let k=puddles.length-1;k>=0;k--){const q=puddles[k];q.t++;
  if(q.kind==='whirl'){const cx=(q.x1+q.x2)/2;if(q.t%4===0)fxPush({k:'water',x:cx+Math.cos(q.t*0.3)*50,y:q.y-4,vx:-Math.sin(q.t*0.3)*2,vy:-0.6,t:0,len:14,s:5});
   for(const t of fighters){if(t===q.owner||t.out||!canBeHit(t))continue;if(G&&G.boss)continue;const dx=cx-t.x;if(Math.abs(dx)<110&&t.y>q.y-70&&t.y<=q.y+2){if(t.ground===q.surf)t.x+=sgn(dx)*Math.min(1.8,Math.abs(dx));if(Math.abs(dx)<28&&q.t%14===0){t.pct=Math.min(999,t.pct+1.5);t.hud=5;q.owner.dmgDone+=1.5;}if(Math.abs(dx)<28&&q.t>=q.len-2)hitTarget(q.owner,t,{d:7,a:80,b:46,g:60},cx,q.y-20,1,{vx:0});}}}
  else if(q.kind==='wax'){for(const t of fighters){if(t===q.owner||t.out)continue;if(t.ground===q.surf&&t.x>=q.x1-t.w/3&&t.x<=q.x2+t.w/3)t.waxT=3;}}
  else if(q.kind==='foam'){for(const t of fighters){if(t===q.owner||t.out)continue;if(t.ground===q.surf&&t.x>=q.x1-t.w/3&&t.x<=q.x2+t.w/3)t.slickT=3;}}
  else if(q.t%20===0)for(const t of fighters){if(t===q.owner||!canBeHit(t)||friendly(q.owner,t))continue;
   if(t.ground===q.surf&&t.x>=q.x1-t.w/3&&t.x<=q.x2+t.w/3){t.pct=Math.min(999,t.pct+1);t.hud=5;t.flash=4;q.owner.dmgDone+=1;
    fxPush({k:'gas',x:t.x,y:t.y-8,vx:0,vy:-1,t:0,len:20,s:10});}}
  if(q.t>=q.len||q.owner.out)puddles.splice(k,1);}
}

/* ---------------- KOs ---------------- */
function checkBlast(f){
 if(f.out||f.state==='respawn')return;const B=STG.blast;
 if(f.x<B.l||f.x>B.r||f.y>B.b||f.y-f.h<B.t)ko(f);
}
function ko(f){
 const B=STG.blast;const bx=clamp(f.x,B.l,B.r),by=clamp(f.y-f.h/2,B.t,B.b);
 fxPush({k:'ko',x:bx,y:by,t:0,len:50,col:f.col,ang:Math.atan2(cam.y-by,cam.x-bx)});
 shake(16);snd('ko',1);
 f.falls++;
 if(f.lastHit&&frame-f.lastHitF<420&&f.lastHit!==f&&!f.lastHit.out){f.lastHit.kos++;f.lastHit.score++;}else f.sds++;
 f.score--;
 if(f.held){const h=f.held;h.holder=null;f.held=null;setState(h,'air');}
 if(f.holder){const h=f.holder;h.held=null;f.holder=null;setState(h,'idle');}
 f.ledge=null;f.move=null;f.lastHit=null;f.copy=null;f.itm=null;if(f.id==='shelby'){f.shell='own';f.shellHp=shellStats('own').hp;}f.hamT=0;f.starT=0;f.sizeT=0;if(f.size&&f.size!==1)setSize(f,1);if(f.mouth){const o=f.mouth;f.mouth=null;if(o.state==='swallowed'){setState(o,'air');o.inv=30;}}
 if(G&&G.rules.stocks){f.stocks--;if(f.stocks<=0){f.out=true;f.place=fighters.filter(o=>!o.out).length+1;f.outF=frame;return;}}
 f.x=STG.respawn[f.slot];f.y=-300*1.6;f.vx=f.vy=f.kvx=f.kvy=0;f.ground=null;f.pct=0;f.jumps=f.c.njumps;f.shield=60;f.fuel=100;f.ff=false;f.ledgeN=0;f.slowT=0;
 f.hitstun=0;f.tumbling=false;f.armor=false;f.upB=f.sideB=false;f.hoverF=f.c.hover||f.c.float||0;setState(f,'respawn');f.inv=120;
}

/* ---------------- CPU ---------------- */
function cpuInput(f){
 const i=blank(),A=f.ai,L=f.lvl,c=f.c,P=f.prev;
 if(f.dummy||!G||G.countdown>0)return i;
 A.t=(A.t||0)+1;
 const press=k=>{if(!P[k])i[k]=1;};
 let t=null,bd=1e9;
 if(G.boss)t=G.boss.T.alive?G.boss.T:null;
 else for(const o of fighters){if(o===f||o.out||o.state==='respawn')continue;const d=Math.abs(o.x-f.x)+Math.abs(o.y-f.y)*0.8;if(d<bd){bd=d;t=o;}}
 switch(f.state){
  case 'respawn':if(f.sf>40+(A.rw||(A.rw=1+rand()*50))){i.x=0.5;A.rw=0;}return i;
  case 'ledge':if(A.ld===undefined)A.ld=12+(9-L)*5+rand()*30;
   if(f.sf>A.ld){const r=rand();A.ld=undefined;if(r<0.45)i.x=f.ledge.side;else if(r<0.7)press('j');else if(r<0.85)press('a');else press('s');}return i;
  case 'lying':if(f.sf>12+rand()*20)i.y=-1;return i;
  case 'fold':return i;
  case 'rope':if(f.sf>30&&sgn(f.ropeV)===sgn(-f.x)&&Math.abs(f.ropeV)>0.02)press('j');else i.x=sgn(-f.x)*0.6;return i;
  case 'dizzy':case 'held':case 'bubbled':case 'squeezed':case 'swallowed':if(rand()<L/12){if(A.t%2)press('a');i.x=A.t%6<3?1:-1;}return i;
  case 'hitstun':{
   if(A.di===undefined)A.di=rand()<0.5?-1:1;i.x=A.di*(L>3?1:0);i.y=-0.3*(L>5?1:0);
   if(!f.ground&&f.y>-60&&f.y<5&&Math.abs(f.x)<250&&f.vy+f.kvy>0&&rand()<0.04*L)press('s');
   return i;}
 }
 A.di=undefined;
 if(f.state==='attack'&&f.move){if(f.move.inhale&&(A.inh||0)>0){A.inh--;i.b=1;return i;}if(f.move.name==='nbfull'){if(f.mf>14+rand()*20&&!P.b){if(rand()<0.3&&L>4)press('a');else i.b=1;}return i;}}
 const M=cpuHome(f),offX=f.x<M.x1-4||f.x>M.x2+4,below=f.y>M.y+4;
 if(!f.ground&&(offX||below))return cpuRecover(f,i,press);
 if(f.state==='special_fall'||f.state==='airdodge'){i.x=sgn(-f.x)*0.5;return i;}
 if(!t)return i;
 const dx=t.x-f.x,adx=Math.abs(dx),dir=sgn(dx)||f.face;
 const dy=(t.y-t.h/2)-(f.y-f.h/2);
 const per=Math.max(3,26-L*2.4);
 A.cd=(A.cd||0)-1;
 const tOff=t.x<M.x1-10||t.x>M.x2+10||t.y>10;
 if(f.state==='attack'&&f.move&&f.move.crank){if((A.crank||0)>0){A.crank--;i.b=1;i.y=1;}return i;}
 if(f.ground){
  if(STG.gantry&&f.ground&&(HZ.phase==='sweep'&&Math.abs(HZ.x-f.x)<150&&sgn(f.x-HZ.x)===HZ.dir||HZ.phase==='warn'&&HZ.t>100&&Math.abs(f.x+HZ.dir*1150*BX)>0)&&HZ.phase==='sweep'){press('j');return i;}
  if(STG.spot&&f.ground===STG.main&&HZ.tl){const T=STG.tiles;const k=T.findIndex((x,j)=>j<T.length-1&&f.x>x&&f.x<T[j+1]);if(k>=0&&HZ.tl[k].st==='crack'){i.x=f.x-(T[k]+T[k+1])/2<0?-1:1;if(Math.abs(f.x)>STG.main.x2-60)i.x=-sgn(f.x);return i;}}
  if(STG.ship&&HZ.sh&&HZ.sh.t<110&&f.ground&&Math.abs(f.x-HZ.sh.x)<100){i.x=sgn(f.x-HZ.sh.x)||1;if(edgeStop(f,i.x,null))i.x=-i.x;return i;}
  if(STG.stampede&&f.ground===STG.main&&HZ.phase==='sweep'&&sgn(f.x-HZ.x)===HZ.dir&&Math.abs(HZ.x-f.x)<210){press('j');return i;}
  if(STG.lava&&(HZ.lp==='warn'||HZ.lp==='rise'||HZ.lp==='high')&&f.ground===STG.main){const tp=STG.plats.slice(0,2).sort((a,b)=>Math.abs((a.x1+a.x2)/2-f.x)-Math.abs((b.x1+b.x2)/2-f.x))[0];const cx=(tp.x1+tp.x2)/2;
   i.x=Math.abs(cx-f.x)>20?sgn(cx-f.x):0;if(Math.abs(cx-f.x)<90)press('j');return i;}
  if(STG.kitchen&&HZ.burn&&HZ.burn.ph!=='off'&&f.ground===STG.main){const bx=STG.burners[HZ.burn.i];if(Math.abs(f.x-bx)<80){i.x=sgn(f.x-bx)||1;return i;}}
  if(STG.dragon&&HZ.dg&&HZ.dg.ph===2&&f.ground){const D=HZ.dg,fx=D.x+D.dir*50,ahead=(f.x-fx)*D.dir;if(ahead>-60&&ahead<420){let cover=null;for(const p of STG.plats)if(f.x>p.x1-10&&f.x<p.x2+10&&p.y<f.y)cover=p;if(!cover){i.s=1;return i;}}}
  if(STG.fireworks&&HZ.fw&&Math.abs(f.x-HZ.fw.x)<110&&f.y>-130){i.x=sgn(f.x-HZ.fw.x)||1;if(HZ.fw.t>60)press('j');return i;}
  if(STG.hurricane&&HZ.phase==='wind'){i.x=-HZ.dir;if(f.ground&&Math.abs(f.x)>STG.main.x2-90&&sgn(f.x)===HZ.dir)return i;}
  if(f.ground&&f.ground.ice&&f.ground.occ>380){i.x=sgn(-((f.ground.x1+f.ground.x2)/2))||1;press('j');return i;}
  if(f.ground&&f.ground.moving&&(Math.abs(f.x)>440||f.y<-330||f.y>170||(f.ground.vx&&sgn(f.ground.vx)===sgn(f.x)&&Math.abs(f.x)>300))){i.x=sgn(-f.x)||1;press('j');return i;}
  if(items.length&&!G.boss){
   if(f.itm&&ITEM[f.itm].cat==='throw'&&t&&adx<330&&Math.abs(dy)<90&&rand()<0.08){if(f.face!==dir){i.x=dir*0.5;return i;}press('z');return i;}
   if(!f.itm||ITEM[f.itm].cat!=='weapon'){let best=null,bd=180;for(const it of items){if(it.thrown||it.slide||!it.ground)continue;const d=Math.abs(it.x-f.x);if(d<bd&&Math.abs(it.y-f.y)<40&&(ITEM[it.k].cat==='power'||!f.itm)){bd=d;best=it;}}
    if(best&&rand()<0.9){if(bd>24&&!edgeStop(f,sgn(best.x-f.x),null)){i.x=sgn(best.x-f.x);return i;}if(ITEM[best.k].cat!=='power'){press('a');return i;}}}}
  if(A.down>0){A.down--;i.y=1;return i;}
  if(A.sh>0){A.sh--;i.s=1;if(A.sh===0&&rand()<0.4&&adx<c.range+20)press('z');return i;}
  if(f.id==='calypso'&&!f.sideB&&rand()<0.02*L&&(projectiles.some(p=>p.owner!==f&&Math.abs(p.x-f.x)<130&&Math.abs(p.y-(f.y-f.h/2))<50&&sgn(p.vx)===sgn(f.x-p.x))||(t.state==='attack'&&t.move&&!t.move.air&&adx<c.range+40&&Math.abs(dy)<50&&t.mf<6))){
   const d2=projectiles.find(p=>p.owner!==f&&Math.abs(p.x-f.x)<130);i.x=d2?sgn(d2.x-f.x)||dir:dir;press('b');return i;}
  if(f.id==='gouda'&&t.state==='attack'&&t.move&&t.move.hb&&adx<c.range+60&&Math.abs(dy)<60&&t.mf<6&&rand()<0.02*L){i.y=1;press('b');return i;}
  if(f.id==='wick'&&t.state==='attack'&&t.move&&t.move.hb&&adx<c.range+50&&Math.abs(dy)<60&&t.mf<5&&rand()<0.01*L){i.y=1;press('b');return i;}
  if(f.id==='gouda'&&adx<70&&Math.abs(dy)<30&&rand()<0.03*L&&!edgeStop(f,dir,t)){i.x=dir;press('b');return i;}
  if(t.state==='attack'&&t.move&&!t.move.air&&adx<c.range+70&&Math.abs(dy)<90&&rand()<0.012*L){A.sh=6+Math.floor(rand()*14);i.s=1;return i;}
  if(A.cd>0){if(A.mv){i.x=A.mv;if(edgeStop(f,A.mv,t))i.x=0;}return i;}
  A.cd=per*(0.5+rand());A.mv=0;
  if(tOff){
   // edgeguard: walk toward the edge they're near, wait

 if(k==='bat'){ctx.fillStyle='#c8955a';ctx.strokeStyle=ink;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(-3,14);ctx.lineTo(-6,-18);ctx.quadraticCurveTo(0,-26,6,-18);ctx.lineTo(3,14);ctx.closePath();ctx.fill();ctx.stroke();ctx.fillStyle='#5a3a20';ctx.fillRect(-3.5,8,7,8);ctx.strokeRect(-3.5,8,7,8);}
 else if(k==='blade'){ctx.fillStyle='#4a4e5c';ctx.strokeStyle=ink;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(-3.5,4,7,13,2);ctx.fill();ctx.stroke();ctx.save();ctx.shadowColor='#5ef0ff';ctx.shadowBlur=12;ctx.fillStyle='#bff8ff';ctx.beginPath();ctx.roundRect(-2.5,-30,5,34,2.5);ctx.fill();ctx.restore();ctx.strokeStyle='#5ef0ff';ctx.lineWidth=1.4;ctx.beginPath();ctx.roundRect(-2.5,-30,5,34,2.5);ctx.stroke();}
 else if(k==='hammer'){ctx.fillStyle='#c8955a';ctx.strokeStyle=ink;ctx.lineWidth=2.2;ctx.fillRect(-2.5,-14,5,30);ctx.strokeRect(-2.5,-14,5,30);ctx.fillStyle='#d0463c';ctx.beginPath();ctx.roundRect(-15,-28,30,16,4);ctx.fill();ctx.stroke();ctx.fillStyle='#e8e2d6';ctx.fillRect(-15,-24,4,8);ctx.fillRect(11,-24,4,8);}
 else if(k==='bomb'){const blink=fuse>4.5*TPS&&(frame>>2)%2;ctx.fillStyle=blink?'#e04a3a':'#2a2a36';ctx.strokeStyle=ink;ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(0,-11,11,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.arc(-4,-15,3,0,7);ctx.fill();
  ctx.fillStyle='#8a8e9c';ctx.fillRect(-3,-25,6,5);ctx.strokeStyle='#c8955a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,-25);ctx.quadraticCurveTo(5,-30,3,-34);ctx.stroke();if((frame>>1)%2){ctx.fillStyle='#ffd166';ctx.beginPath();ctx.arc(3,-35,3,0,7);ctx.fill();}}
 else if(k==='shell'){ctx.fillStyle='#e8964a';ctx.strokeStyle=ink;ctx.lineWidth=2.2;ctx.beginPath();ctx.ellipse(0,-10,14,10,0,Math.PI,0);ctx.lineTo(14,-2);ctx.lineTo(-14,-2);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.strokeStyle='#8a4a1a';ctx.lineWidth=1.6;ctx.beginPath();ctx.arc(2,-8,6,Math.PI*0.9,Math.PI*2.6);ctx.stroke();ctx.beginPath();ctx.arc(3,-8,2.5,0,7);ctx.stroke();ctx.fillStyle='#f4e8d0';ctx.fillRect(-14,-3,28,3);}
 else if(k==='crate'){ctx.fillStyle='#b8834a';ctx.strokeStyle=ink;ctx.lineWidth=2.4;ctx.fillRect(-18,-36,36,36);ctx.strokeRect(-18,-36,36,36);ctx.strokeStyle='#7a4f22';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-15,-33);ctx.lineTo(15,-3);ctx.moveTo(15,-33);ctx.lineTo(-15,-3);ctx.stroke();ctx.strokeStyle=ink;ctx.lineWidth=2;ctx.strokeRect(-18,-36,36,36);}
 else if(k==='mango'){ctx.fillStyle='#ffb02e';ctx.strokeStyle=ink;ctx.lineWidth=2.2;ctx.beginPath();ctx.ellipse(0,-11,10,12,0.4,0,7);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,90,60,.55)';ctx.beginPath();ctx.ellipse(4,-15,5,6,0.4,0,7);ctx.fill();ctx.fillStyle='#4cae4c';ctx.beginPath();ctx.ellipse(-4,-24,6,3,-0.6,0,7);ctx.fill();ctx.stroke();}
 else if(k==='star'){ctx.save();ctx.translate(0,-12);ctx.rotate(t*0.15);ctx.shadowColor='#fff3a0';ctx.shadowBlur=14;ctx.fillStyle=`hsl(${(t*8)%360},95%,65%)`;ctx.strokeStyle=ink;ctx.lineWidth=2;ctx.beginPath();for(let k2=0;k2<10;k2++){const a=k2/10*Math.PI*2-Math.PI/2,r=k2%2?6:14;k2?ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r):ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);}ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();}
 else if(k==='potion'){ctx.fillStyle='rgba(220,240,255,.6)';ctx.strokeStyle=ink;ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(-4,-26);ctx.lineTo(-4,-18);ctx.quadraticCurveTo(-12,-14,-12,-7);ctx.quadraticCurveTo(-12,0,0,0);ctx.quadraticCurveTo(12,0,12,-7);ctx.quadraticCurveTo(12,-14,4,-18);ctx.lineTo(4,-26);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=`hsl(${280+Math.sin(t*0.1)*30},80%,60%)`;ctx.beginPath();ctx.moveTo(-11,-8);ctx.quadraticCurveTo(-11,-1,0,-1);ctx.quadraticCurveTo(11,-1,11,-8);ctx.closePath();ctx.fill();ctx.fillStyle='#c8955a';ctx.fillRect(-4,-30,8,5);ctx.strokeRect(-4,-30,8,5);
  ctx.fillStyle='#fff';ctx.font='800 9px sans-serif';ctx.textAlign='center';ctx.fillText('?',0,-6);}}
function drawItems(){for(const it of items){const blink=it.ground&&!it.slide&&it.t>it.life-120&&(frame>>2)%2;if(blink)continue;ctx.save();ctx.translate(it.x,it.y);
  if(it.thrown&&ITEM[it.k].cat==='weapon'){ctx.translate(0,-10);ctx.rotate(it.t*0.5);ctx.translate(0,10);}
  if(it.slide&&it.t%6<3)ctx.translate(0,-1);
  if(it.ground&&!it.slide&&ITEM[it.k].cat==='weapon'){ctx.rotate(Math.PI/2*0.9);ctx.translate(-6,-4);}
  drawItemArt(it.k,it.t,it.fuse);ctx.restore();
  if(it.y<-300&&!it.ground&&it.t<40){ctx.strokeStyle='rgba(255,209,102,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(it.x,it.y-10,18+Math.sin(frame*0.3)*3,0,7);ctx.stroke();}}}
// held item, drawn in the fighter's own (already flipped) space
function drawHeld(f){const k=f.itm;if(!k)return;ctx.save();const hx=f.w*0.38,hy=-f.h*0.5;
 if(k==='hammer'){const a=-1.6+Math.sin(frame*0.38)*1.9;ctx.translate(0,-f.h*0.6);ctx.rotate(a+Math.PI/2);ctx.translate(0,8);ctx.scale(1.3,1.3);drawItemArt('hammer',0,0);ctx.restore();return;}
 let ang=-0.5;const m=f.state==='attack'&&f.move&&f.move.item;if(m){const hb=f.move.hb[0],s0=hb.s,e0=hb.e;ang=f.mf<s0?-0.5-1.8*(f.mf/s0):f.mf<=e0?-2.3+3.4*((f.mf-s0)/Math.max(1,e0-s0)):1.1;ctx.translate(hx*0.7,hy);ctx.rotate(ang+Math.PI/2);ctx.translate(0,4);}
 else if(ITEM[k].cat==='throw'){ctx.translate(hx*0.6,hy+8);ctx.scale(0.85,0.85);}
 else{ctx.translate(hx,hy+6);ctx.rotate(-0.4);}
 drawItemArt(k,frame,0);ctx.restore();}

/* ---------------- BOSS MODE: Big Mitt ----------------
   A giant glove with HP, fought by up to four players on the same side. */
const BOSSF={slot:8,id:'boss',x:0,y:0,face:-1,dmgDone:0,kos:0,score:0,out:false,move:null,hitlag:0,col:'#ffffff',c:{name:'Big Mitt',weight:200},hitSet:new Map()};
function friendly(a,t){return !!(G&&G.boss&&a!==BOSSF&&t!==BOSSF);}
const BOSS_S=4.4;
function makeBoss(diff,n){const hp=Math.round([240,340,460][diff]*(1+0.25*(n-1)));
 return{x:0,y:-760,face:-1,hp,max:hp,ghost:hp,diff,spd:[0.85,1,1.25][diff],st:'enter',t:0,pose:'open',aim:-1.57,R:92,flash:0,cd:new Map(),last:'',tgt:null,
  dmg:{},sqT:0,sqDmg:0,held:null,n:0,over:null,T:{x:0,y:0,w:120,h:100,state:'idle',pct:0,ground:null,move:null,out:false,alive:true,mf:0,stocks:1},startF:frame,endF:0};}
function bossTouch(x,y,r,owner,d){const B=G&&G.boss;if(!B||owner===BOSSF||B.hp<=0||B.st==='enter'||B.st==='dead')return false;
 if((x-B.x)**2+(y-B.y)**2>(r+B.R)**2)return false;
 const dd=Math.max(1,Math.round(d));B.hp=Math.max(0,B.hp-dd);B.flash=6;if(owner){owner.dmgDone+=dd;B.dmg[owner.slot]=(B.dmg[owner.slot]||0)+dd;}
 if(B.held)B.sqDmg+=dd;fxPush({k:'spark',x:(x+B.x)/2,y:(y+B.y)/2,t:0,len:10+dd*0.4,s:12+dd*1.6});snd('hit',Math.min(1,0.25+dd/18));
 if(B.hp<=0){bossDie();}return true;}
function bossTarget(B){const live=fighters.filter(f=>!f.out&&f.state!=='respawn');if(!live.length)return null;
 if(B.tgt&&live.includes(B.tgt)&&rand()<0.6)return B.tgt;return live[Math.floor(rand()*live.length)];}
function bossGo(B,st){B.st=st;B.t=0;B.ph=0;B.cd.clear();}
function bossMove(B,tx,ty,k,max){const dx=tx-B.x,dy=ty-B.y;let vx=dx*k,vy=dy*k;const m=Math.hypot(vx,vy);if(m>max){vx*=max/m;vy*=max/m;}B.x+=vx;B.y+=vy;}
// hit every fighter touching a circle; cd = frames before the same fighter can be hit by this key again
function bossHit(cx,cy,r,hb,dir,key,cd){const B=G.boss;for(const f of fighters){if(!canBeHit(f)||f.state==='squeezed')continue;const k=f.slot+key,l=B.cd.get(k);if(l!==undefined&&frame-l<cd)continue;
  const sh=f.state==='shield'||f.state==='shieldstun';const hit=sh?((cx-f.x)**2+(cy-(f.y-f.h/2))**2<=(r+shieldR(f))**2):circRect(cx,cy,r,hurtHit(f));
  if(!hit)continue;B.cd.set(k,frame);hitTarget(BOSSF,f,hb,(cx+f.x)/2,(cy+f.y-f.h/2)/2,1,{vx:dir||sgn(f.x-cx)||1});}}
function bossDie(){const B=G.boss;bossDrop(B);bossGo(B,'dead');B.endF=frame;snd('ko',1);shake(20);}
function bossDrop(B){const f=B.held;if(!f)return;B.held=null;if(f.state==='squeezed'){setState(f,'air');f.vy=-4;f.inv=30;}}
const BOSS_ATK=['slap','poke','gun','slam','punch','grab','drill'];
function bossPick(B){const low=B.hp<B.max*0.5;const w={slap:2,poke:2,gun:2,slam:2,punch:1.5,grab:1.6,drill:low?2.2:0};w[B.last]=(w[B.last]||0)*0.25;
 let tot=0;for(const k in w)tot+=w[k];let r=rand()*tot;for(const k of BOSS_ATK){r-=w[k];if(r<=0)return k;}return 'slap';}
function stepBoss(){const B=G.boss;if(!B)return;B.t++;if(B.flash>0)B.flash--;const S=B.spd;B.ghost=Math.max(B.hp,B.ghost-(B.max*0.004));
 const ground=STG.main.y,L=STG.main.x1,R=STG.main.x2,edge=Math.max(-L,R);
 if(G.countdown>0&&B.st!=='enter'){B.y=lerp(B.y,-260,0.1);return syncBossT(B);}
 const tg=B.tgt&&!B.tgt.out?B.tgt:null;
 switch(B.st){
  case 'enter':B.y=lerp(B.y,-200,0.05);B.x=lerp(B.x,0,0.05);B.pose='open';B.aim=-1.57+Math.sin(frame*0.05)*0.2;if(B.t>90&&G.countdown<=0)bossGo(B,'idle');break;
  case 'idle':{if(!tg)B.tgt=bossTarget(B);const t=B.tgt;if(!t)break;const side=t.x>0?-1:1;B.face=sgn(t.x-B.x)||B.face;
   bossMove(B,clamp(t.x+side*170,L+60,R-60),-215+Math.sin(frame*0.05)*16,0.035,5*S);B.pose='open';B.aim=lerp(B.aim,-1.2,0.1);
   if(B.t>Math.round(80/S)){B.last=B.st=bossPick(B);B.t=0;B.ph=0;B.cd.clear();B.tgt=bossTarget(B);if(B.st==='slap'||B.st==='punch')B.side=(B.tgt&&B.tgt.x>0)?-1:1;}break;}
  case 'slap':{B.pose='open';B.aim=0;const sx=B.side*(edge+110);
   if(B.ph===0){B.face=-B.side;bossMove(B,sx,ground-58,0.08,12*S);if(B.t>45){B.ph=1;B.t=0;snd('swing',.6);}}
   else if(B.ph===1){B.x+=Math.sin(B.t*1.3)*2;if(B.t>Math.round(30/S)){B.ph=2;B.t=0;snd('whoosh',.9);}}
   else{B.x+=B.face*15*S;if(B.t%3===0)dust(B.x-B.face*40,ground,2);bossHit(B.x+B.face*40,B.y+6,58,{d:16,a:40,b:52,g:84},B.face,'slap',60);if(Math.abs(B.x)>edge+140&&sgn(B.x)===B.face)bossGo(B,'idle');}
   break;}
  case 'poke':{B.pose='point';B.aim=1.57;
   if(B.ph===0){if(tg)bossMove(B,tg.x,-250,0.12,10*S);if(B.t>30){B.ph=1;B.t=0;B.n=0;}}
   else{const T=B.t,w=Math.round(18/S);
    if(T<w){if(tg)B.x=lerp(B.x,tg.x,0.12);B.y=lerp(B.y,-280,0.2);}
    else if(T<w+6){B.y=lerp(B.y,ground-150,0.5);if(T===w)snd('swing',.7);}
    else if(T<w+16){B.y=ground-150;if(T===w+6){shake(4);dust(B.x,ground,5);}}
    else if(T<w+30){B.y=lerp(B.y,-250,0.18);}
    else{B.n++;B.t=0;if(B.n>=3)bossGo(B,'idle');}
    if(T>=w&&T<w+16)bossHit(B.x,B.y+122,32,{d:10,a:80,b:42,g:72},0,'poke'+B.n,30);}
   break;}
  case 'gun':{B.pose='gun';if(!tg){bossGo(B,'idle');break;}const side=tg.x>B.x?-1:1;
   if(B.ph===0){bossMove(B,clamp(tg.x+side*360,L-120,R+120),-170,0.08,10*S);B.face=-side;if(B.t>36){B.ph=1;B.t=0;B.n=0;}}
   else{const ax=Math.atan2((tg.y-tg.h/2)-B.y,(tg.x-B.x)*B.face);B.aim=lerp(B.aim,clamp(ax,-0.9,1.2),0.2);
    if(B.t%Math.round(15/S)===0){const a=B.aim,v=10*S,tipx=B.x+B.face*Math.cos(a)*128,tipy=B.y+Math.sin(a)*128;
     projectiles.push({k:'bbullet',owner:BOSSF,x:tipx,y:tipy,vx:B.face*Math.cos(a)*v,vy:Math.sin(a)*v,g:0,t:0,len:80,r:12,hb:{d:7,a:35,b:34,g:44}});snd('boom',.35);fxPush({k:'spark',x:tipx,y:tipy,t:0,len:8,s:16,col:'#ffe08a'});B.n++;}
    if(B.n>=5&&B.t>20)bossGo(B,'idle');}
   break;}
  case 'slam':{B.pose='flat';B.aim=1.57;
   if(B.ph===0){if(tg)bossMove(B,tg.x,-560,0.1,14*S);if(B.t>Math.round(55/S)){B.ph=1;B.t=0;}}
   else if(B.ph===1){B.y+=Math.sin(B.t)*1.5;if(B.t>18){B.ph=2;B.t=0;snd('whoosh',.8);}}
   else if(B.ph===2){B.y+=26*S;bossHit(B.x,B.y+24,96,{d:18,a:75,b:58,g:82},0,'slam',60);
    if(B.y>=ground-70){B.y=ground-70;B.ph=3;B.t=0;shake(14);snd('boom',1);dust(B.x,ground,16);
     for(const d of [-1,1])projectiles.push({k:'swave',owner:BOSSF,x:B.x+d*90,y:ground-16,vx:d*8*S,vy:0,g:0,t:0,len:60,r:20,hb:{d:8,a:80,b:44,g:40}});}}
   else if(B.t>Math.round(40/S))bossGo(B,'idle');
   break;}
  case 'punch':{B.pose='fist';B.aim=0;
   if(B.ph===0){const ty=tg?clamp(tg.y-tg.h/2,-220,ground-70):-90;B.face=-B.side;bossMove(B,B.side*(edge+330),ty,0.09,16*S);if(B.t>50){B.ph=1;B.t=0;B.py=B.y;}}
   else if(B.ph===1){if(tg)B.y=lerp(B.y,clamp(tg.y-tg.h/2,-220,ground-70),0.06);if(B.t>Math.round(32/S)){B.ph=2;B.t=0;snd('whoosh',1);}}
   else{B.x+=B.face*24*S;bossHit(B.x+B.face*50,B.y,74,{d:20,a:38,b:60,g:86},B.face,'punch',60);if(B.t%2===0)fxPush({k:'gust',x:B.x-B.face*90,y:B.y+(rand()-.5)*60,vx:-B.face*6,vy:0,t:0,len:12,s:24});
    if(Math.abs(B.x)>edge+380&&sgn(B.x)===B.face)bossGo(B,'idle');}
   break;}
  case 'grab':{B.pose='claw';B.aim=0;
   if(B.ph===0){if(!tg){bossGo(B,'idle');break;}B.face=sgn(tg.x-B.x)||B.face;bossMove(B,tg.x-B.face*150,tg.y-tg.h/2,0.08,9*S);if(B.t>40){B.ph=1;B.t=0;snd('swing',.7);}}
   else if(B.ph===1){B.x+=B.face*13*S;if(tg)B.y=lerp(B.y,tg.y-tg.h/2,0.15);B.pose='open';
    for(const f of fighters){if(!canBeHit(f)||f.state==='shield')continue;if(circRect(B.x+B.face*80,B.y,64,hurtHit(f))){B.held=f;f.move=null;f.armor=false;setState(f,'squeezed');f.ground=null;f.held&&(f.held.holder=null);f.held=null;B.ph=2;B.t=0;B.sqT=150;B.sqDmg=0;snd('grabl',.9);break;}}
    if(B.ph===1&&B.t>34)bossGo(B,'idle');}
   else if(B.ph===2){const f=B.held;B.pose='fist';if(!f||f.out||f.state!=='squeezed'){bossDrop(B);bossGo(B,'idle');break;}
    B.y=lerp(B.y,-230,0.06);B.x=lerp(B.x,0,0.02);f.x=B.x+B.face*60;f.y=B.y+f.h*0.5;B.sqT--;
    if(B.t%24===0){f.pct=Math.min(999,f.pct+4);f.hud=6;f.flash=4;BOSSF.dmgDone+=4;snd('hit',.35);fxPush({k:'spark',x:f.x,y:f.y-f.h/2,t:0,len:8,s:14});}
    if(B.sqDmg>=25){bossDrop(B);snd('pop',.8);bossGo(B,'idle');break;}
    if(B.sqT<=0){B.held=null;f.x=B.x+B.face*70;launch(f,10,45,62,80,B.face,BOSSF,true);f.hitlag=6;snd('hit',.9);bossGo(B,'idle');}}
   break;}
  case 'drill':{B.pose='fist';B.aim=1.57;
   if(B.ph===0){if(tg)bossMove(B,tg.x,-330,0.1,12*S);if(B.t>40){B.ph=1;B.t=0;snd('buzz',.7);}}
   else if(B.ph===1){if(tg)B.x=lerp(B.x,tg.x,0.03*S);B.y=Math.min(ground-100,B.y+3.2*S);if(B.t%3===0)fxPush({k:'gust',x:B.x+(rand()-.5)*60,y:B.y+60,vx:(rand()-.5)*6,vy:-1,t:0,len:12,s:16});if(B.t%8===0)snd('buzz',.25);
    bossHit(B.x,B.y+92,52,{d:3,a:80,b:22,g:10},0,'drill',7);if(B.t>78){B.ph=2;B.t=0;bossHit(B.x,B.y+80,84,{d:11,a:80,b:62,g:72},0,'drillend',60);shake(8);}}
   else{B.y=lerp(B.y,-260,0.08);if(B.t>30)bossGo(B,'idle');}
   break;}
  case 'dead':{B.pose='open';B.aim+=0.08;B.y+=Math.min(6,B.t*0.08);B.x+=Math.sin(B.t*0.9)*3;if(B.t%5===0){fxPush({k:'spark',x:B.x+(rand()-.5)*160,y:B.y+(rand()-.5)*160,t:0,len:16,s:30,col:['#ffd166','#ff5a5f','#ffffff'][B.t%3]});snd('boom',.4);}
   if(B.t===130&&!B.over){B.over='win';endMatch();}break;}
 }
 syncBossT(B);}
function syncBossT(B){BOSSF.x=B.x;BOSSF.y=B.y;BOSSF.face=B.face;const T=B.T;T.alive=B.hp>0&&B.st!=='dead'&&Math.abs(B.x)<STG.main.x2+80;T.x=clamp(B.x,STG.main.x1+20,STG.main.x2-20);T.y=Math.min(B.y+50,0);
 const atk=B.st!=='idle'&&B.st!=='enter';T.state=atk?'attack':'idle';T.move=atk?{}:null;T.ground=B.y>-140?STG.main:null;}
function drawBoss(){const B=G.boss;
 // ground shadow
 const gy=STG.main.y,h=Math.max(0,gy-B.y);if(Math.abs(B.x)<STG.main.x2+60){ctx.fillStyle=`rgba(0,0,0,${clamp(0.32-h/1600,0.08,0.3)})`;ctx.beginPath();ctx.ellipse(B.x,gy-2,clamp(140-h*0.1,50,140),10,0,0,7);ctx.fill();}
 // punch warning at the screen edge

 const rules=opts.rules||{stocks:(setup.rules==='time')?0:setup.stocks,time:(setup.rules==='stock')?0:setup.minutes*60*TPS};

function playStep(th,st,t,spb){

 if(th.bass==='eighths'){if(s16%2===0)voice('square',mnote(rootM+(s16%8===4?7:0)),t,spb*1.6,0.1,700);}
 else if(th.bass==='heavy'){if(s16%2===0){voice('sawtooth',mnote(rootM),t,spb*1.8,0.12,500);voice('square',mnote(rootM-12),t,spb*1.8,0.08,300);}}

 if(th.pad&&s16===0){const tri=[0,2,4].map(k=>th.deg2midi(ch+k)-12);for(const m of tri){voice('sawtooth',mnote(m),t,spb*16,0.025*th.pad,900);voice('sawtooth',mnote(m)*1.006,t,spb*16,0.02*th.pad,900);}}
 if(th.skank&&(s16===4||s16===12)){for(const k of [0,2,4])voice('square',mnote(th.deg2midi(ch+k)),t,0.09,0.035,2600);}
 if(D.k.includes(s16))musDrum('k',t);if(D.s.includes(s16))musDrum('s',t);if(D.h.includes(s16))musDrum('h',t);
}

function limbTarget(f){
 if(f.state!=='attack'||!f.move||!f.move.hb)return null;let best=null;
 for(const hb of f.move.hb){if(f.mf>=hb.s-4&&f.mf<=hb.e+5){best=hb;break;}}
 if(!best)return null;const k=f.mf<best.s?(f.mf-best.s+4)/4:f.mf>best.e?1-(f.mf-best.e)/5:1;

 return{x:best.x*sc*clamp(k,0,1),y:best.y*clamp(k,0,1),r:best.r,active:f.mf>=best.s&&f.mf<=best.e,hb:best};
}

  let a=null,b=null;for(let k=0;k<S.length;k++){if(S[k].f<=tF)a=S[k];else{b=S[k];break;}}
  if(!a){a=S[0];b=null;}
  if(a!==NET.applied){applySnap(a);NET.applied=a;}else applyDiscreteless(a);

  const X=FX_I;if(Math.abs(r[X]-q[X])>200||Math.abs(r[X+1]-q[X+1])>200)return;f.x=lerp(q[X],r[X],k);f.y=lerp(q[X+1],r[X+1],k);});

// portrait drawing using the shared drawing functions on another canvas
function drawPortraitSafe(canvas,id,slot){
 const x=canvas.getContext('2d'),s=canvas.width;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,s,s);
 const pc=typeof slot==='string'?slot:PCOL[slot];x.fillStyle=pc+'40';x.beginPath();x.arc(s/2,s/2,s/2-2,0,7);x.fill();
 const real=ctx;ctx=x;
 try{const k=s/64;x.translate(s/2,s*0.8);const P=PORT[id],sc=P.s*1.15;x.scale(k*sc,k*sc);x.translate(P.dx,P.dy);
  const fake={id,c:CHARS[id],state:'idle',sf:0,face:1,flash:0,mf:0,slot:0,col:typeof slot==='string'?slot:PCOL[slot],fuel:100,move:null};
  drawChar(fake,null);}finally{ctx=real;}
}
